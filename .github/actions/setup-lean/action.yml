name: Set up pinned Lean
description: Install the pinned Elan bootstrap and repository Lean toolchain.

inputs:
  toolchain-file:
    description: Repository-relative Lean toolchain file.
    required: false
    default: formal/lean-toolchain

outputs:
  cache-hit:
    description: Whether the exact pinned Lean dependency cache was restored.
    value: ${{ steps.lean-dependencies.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore pinned Lean and third-party Lake dependencies
      id: lean-dependencies
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.elan
          formal/.lake/packages
        key: formal-lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}

    - name: Install pinned Lean toolchain
      shell: bash
      env:
        AUTHS_ELAN_VERSION: v4.2.3
        AUTHS_ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        AUTHS_LEAN_TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
      run: |
        set -euo pipefail
        [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]

        setup_dir="$(mktemp -d)"
        archive="${setup_dir}/elan.tar.gz"
        download_url="https://github.com/leanprover/elan/releases/download/${AUTHS_ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"

        for attempt in 1 2 3; do
          if curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --output "${archive}" \
            "${download_url}"; then
            break
          fi
          if [[ "${attempt}" == 3 ]]; then
            exit 1
          fi
          sleep "$((attempt * 15))"
        done

        echo "${AUTHS_ELAN_SHA256}  ${archive}" | sha256sum --check --strict
        tar --extract --gzip --file "${archive}" --directory "${setup_dir}"
        "${setup_dir}/elan-init" -y --default-toolchain none
        echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

        lean_toolchain="$(tr -d '\r\n' < "${AUTHS_LEAN_TOOLCHAIN_FILE}")"
        lean_toolchain_installed=false
        while read -r installed_toolchain _; do
          if [[ "${installed_toolchain}" == "${lean_toolchain}" ]]; then
            lean_toolchain_installed=true
            break
          fi
        done < <("${HOME}/.elan/bin/elan" toolchain list)

        if [[ "${lean_toolchain_installed}" != true ]]; then
          for attempt in 1 2 3; do
            if "${HOME}/.elan/bin/elan" toolchain install "${lean_toolchain}"; then
              break
            fi
            if [[ "${attempt}" == 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
        fi

        "${HOME}/.elan/bin/elan" default "${lean_toolchain}"
        "${HOME}/.elan/bin/lean" --version
        "${HOME}/.elan/bin/lake" --version

    - name: Restore the pinned Mathlib binary cache
      shell: bash
      working-directory: formal
      run: |
        set -euo pipefail
        lake exe cache get

name: PostgreSQL live demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/postgresql-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/postgresql-data-change/**"
      - "product/fixtures/v1/postgresql/**"
      - "product/integrations/auths-postgresql/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/postgresql-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/postgresql-data-change/**"
      - "product/fixtures/v1/postgresql/**"
      - "product/integrations/auths-postgresql/**"

concurrency:
  group: postgresql-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      AUTHS_EXECUTOR_PASSWORD: ci-executor-${{ github.run_id }}-${{ github.run_attempt }}
      AUTHS_POSTGRESQL_FAULT: none
      AUTHS_POSTGRESQL_RECEIPT_FAULT: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: demos/postgresql-data-change/package-lock.json
      - name: Install browser test dependencies
        working-directory: demos/postgresql-data-change
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static frontend contract
        working-directory: demos/postgresql-data-change
        run: npm run check
      - name: Real PostgreSQL rollback, restart, and reconciliation contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-recovery
      - name: Privilege, RLS, injection, concurrency, timeout, and drift contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-database
      - name: Native denial and concurrent-claim contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-contract
      - name: Reset before browser contract
        working-directory: demos/postgresql-data-change
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U migration_admin -d auths_demo -f /demo/reset.sql
      - name: Browser-to-native-to-database contract
        working-directory: demos/postgresql-data-change
        run: npm run test:e2e
      - name: Preserve service logs after failure
        if: failure()
        working-directory: demos/postgresql-data-change
        run: docker compose logs --no-color

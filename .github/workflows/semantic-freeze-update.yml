name: Semantic freeze update

on:
  push:
    branches: [codex/formal-source-closure]

permissions:
  contents: read

jobs:
  update:
    name: generate semantic freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Generate the reviewed semantic inventory
        run: cargo xtask semantic-freeze --update
      - name: Preserve the exact generated inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-semantic-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/semantic-freeze.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

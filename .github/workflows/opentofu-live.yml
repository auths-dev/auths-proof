name: OpenTofu live demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opentofu-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/opentofu-plan/**"
      - "product/fixtures/v1/opentofu/**"
      - "product/integrations/auths-opentofu/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/opentofu-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/opentofu-plan/**"
      - "product/fixtures/v1/opentofu/**"
      - "product/integrations/auths-opentofu/**"

concurrency:
  group: opentofu-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: demos/opentofu-plan/package-lock.json
      - name: Install browser test dependencies
        working-directory: demos/opentofu-plan
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static frontend contract
        working-directory: demos/opentofu-plan
        run: npm run check
      - name: Real OpenTofu fault, restart, and reconciliation contract
        working-directory: demos/opentofu-plan
        run: npm run test:live-recovery
      - name: Native denial and concurrent-claim contract
        working-directory: demos/opentofu-plan
        run: npm run test:live-contract
      - name: Browser-to-native-to-provider contract
        working-directory: demos/opentofu-plan
        run: npm run test:e2e
      - name: Preserve service logs after failure
        if: failure()
        working-directory: demos/opentofu-plan
        run: docker compose logs --no-color

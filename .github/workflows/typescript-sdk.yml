name: TypeScript SDK package

on:
  pull_request:
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/typescript-sdk.yml"
  push:
    branches: [main]
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/typescript-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-node:
    name: packed Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - run: npm ci
        working-directory: bindings/typescript
      - run: npm run build:vectors
        working-directory: bindings/typescript
      - run: npm run test:package
        working-directory: bindings/typescript
      - run: npm run test:api
        working-directory: bindings/typescript
      - run: npm run test:examples
        working-directory: bindings/typescript

  packed-browser:
    name: packed Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - run: npm ci
        working-directory: bindings/typescript
      - run: npm run build:vectors
        working-directory: bindings/typescript
      - run: npx playwright install --with-deps chromium
        working-directory: bindings/typescript
      - run: npm run test:browser
        working-directory: bindings/typescript

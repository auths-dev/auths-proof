name: TypeScript SDK package

on:
  pull_request:
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/typescript-sdk.yml"
  push:
    branches: [main]
    paths:
      - "bindings/typescript/**"
      - ".github/workflows/typescript-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    name: build package runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build:vectors
        working-directory: bindings/typescript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: typescript-sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bindings/typescript/wasm/
            target/binding-vectors/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  packed-node:
    name: packed Node (${{ matrix.os }})
    needs: package-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
        working-directory: bindings/typescript
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: typescript-sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - run: npm run test:package
        working-directory: bindings/typescript
      - run: npm run test:api
        working-directory: bindings/typescript
      - run: npm run test:examples
        working-directory: bindings/typescript

  packed-browser:
    name: packed Chromium
    needs: package-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
        working-directory: bindings/typescript
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: typescript-sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - run: npx playwright install --with-deps chromium
        working-directory: bindings/typescript
      - run: npm run test:browser
        working-directory: bindings/typescript

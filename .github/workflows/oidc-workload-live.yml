name: OIDC workload live compatibility

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Exercise the offline adapter
        run: cargo test -p auths-oidc-workload
      - name: Record redacted GitHub token vocabulary
        shell: bash
        run: |
          set -euo pipefail
          audience="auths-oidc-workload-v1:compatibility-probe"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")"
          token="$(jq -r '.value' <<<"${response}")"
          header="$(cut -d. -f1 <<<"${token}" | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          payload="$(cut -d. -f2 <<<"${token}" | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          jq -n --argjson header "${header}" --argjson payload "${payload}" \
            '{schema:"auths.github-oidc-vocabulary/1",header_names:($header|keys|sort),claim_names:($payload|keys|sort)}' \
            > oidc-vocabulary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oidc-vocabulary
          path: oidc-vocabulary.json

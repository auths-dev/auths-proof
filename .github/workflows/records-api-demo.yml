name: Records API transport demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/records-api-demo.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/rest-api-authorization/**"
      - "exchange/adapters/auths-proof-exchange-iroh/**"
      - "product/fixtures/v1/records-api/**"
      - "product/integrations/auths-records-api/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/records-api-demo.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "demos/rest-api-authorization/**"
      - "exchange/adapters/auths-proof-exchange-iroh/**"
      - "product/fixtures/v1/records-api/**"
      - "product/integrations/auths-records-api/**"

concurrency:
  group: records-api-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Product and HTTP contracts
        run: cargo test -p auths-records-api -p auths-records-demo --lib
      - name: Real Iroh and cross-transport replay contract
        run: >-
          cargo test -p auths-records-demo
          iroh_executes_and_https_replay_cannot_duplicate_the_effect
          -- --ignored --nocapture
      - name: Frontend contract
        working-directory: demos/rest-api-authorization
        run: npm run check
      - name: Production image builds
        run: >-
          docker build
          --file demos/rest-api-authorization/Dockerfile
          --tag auths-records-demo:ci
          .

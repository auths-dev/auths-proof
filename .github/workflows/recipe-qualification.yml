name: Recipe qualification

# The protected run that qualifies recipe families. Started by hand on the
# default branch, it builds the candidate, gathers offline and live evidence
# for every family under qualification/families, assembles one record per
# family, signs them into one release index, and verifies the result as a
# gateway would.
#
# A pull request that changes a family or this run gets the candidate and
# offline-evidence job only. It has no environment and no secret, so it can
# neither gather live evidence, assemble a closed record, nor sign.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "qualification/**"
      - "product/runtime/auths-gateway/**"
      - "product/qualification/**"
      - "examples/stripe-refund-approval/recipe.json"
      - "examples/stripe-refund-approval/profile.lock.json"
      - "bindings/fixtures/gateway/**"
      - ".github/workflows/recipe-qualification.yml"

permissions:
  contents: read

concurrency:
  group: recipe-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: shipping gateway candidate without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Build the shipping binaries without simulation features
        run: |
          cargo build --locked --release -p auths-gateway --bin auths-gateway
          cargo build --locked --release -p auths-recipe-qualification-issuance --bin auths-qualification
          mkdir -p target/qualification-shipping-candidate/bin
          cp target/release/auths-gateway target/release/auths-qualification target/qualification-shipping-candidate/bin/
      - name: Review maintained recipes without installing or leasing custody
        run: |
          target/release/auths-gateway review \
            --recipe qualification/simulation/live/stripe-platform/recipe.json \
            --profile-lock qualification/simulation/live/stripe-platform/profile.lock.json \
            > target/qualification-shipping-candidate/stripe-review.json
          target/release/auths-gateway review \
            --recipe bindings/fixtures/gateway/airtable/recipe.json \
            --profile-lock bindings/fixtures/gateway/airtable/profile.lock.json \
            > target/qualification-shipping-candidate/airtable-review.json
      - name: Bind the retained bytes to this source and run
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('target/qualification-shipping-candidate')
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  files[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'candidate.json').write_text(json.dumps({
              'schema': 'auths.qualification-shipping-candidate/1',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'run_id': os.environ['SOURCE_RUN'], 'run_attempt': os.environ['SOURCE_ATTEMPT'],
              'features': [], 'platform': 'linux-x86_64',
              'qualification_issued': False, 'stable_launch_ready': False,
              'files': files,
          }, sort_keys=True, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-shipping-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification-shipping-candidate
          if-no-files-found: error
          retention-days: 30

  packet-author:
    name: installed packet author and shipping native review
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the installed SDK artifact
        run: |
          python -m pip install maturin==1.9.6
          maturin build --profile python-extension --locked \
            --manifest-path bindings/python/Cargo.toml --out target/qualification-wheels
          python -m venv "${RUNNER_TEMP}/packet-consumer"
          "${RUNNER_TEMP}/packet-consumer/bin/python" -m pip install target/qualification-wheels/*.whl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qualification-shipping-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packet-candidate
      - name: Run the author without a checkout or provider credential
        shell: bash
        run: |
          set -euo pipefail
          kit="${RUNNER_TEMP}/packet-kit"
          mkdir -p "${kit}/qualification/simulation/live" "${kit}/bindings/fixtures/gateway"
          cp -R qualification/reference "${kit}/qualification/"
          cp -R qualification/simulation/live/stripe-platform "${kit}/qualification/simulation/live/"
          cp -R bindings/fixtures/gateway/airtable "${kit}/bindings/fixtures/gateway/"
          chmod +x "${RUNNER_TEMP}/packet-candidate/bin/auths-gateway"
          cd "${RUNNER_TEMP}"
          python "${kit}/qualification/reference/check_packets.py" \
            --gateway "${RUNNER_TEMP}/packet-candidate/bin/auths-gateway" \
            --python "${RUNNER_TEMP}/packet-consumer/bin/python" \
            --work "${RUNNER_TEMP}/packet-operator"
      - name: Reconnect to the installed author under a separate UID
        shell: bash
        run: |
          set -euo pipefail
          sudo -n mkdir -m 0700 "${RUNNER_TEMP}/socket-report"
          # The runner's temp ancestors may be private to its login UID.
          # Copy only the credential-free kit and installed wheel environment
          # into public-readable /opt inputs; keep author output private in /tmp.
          sudo -n mkdir -m 0755 /opt/auths-packet-kit /opt/auths-packet-consumer
          sudo -n cp -R "${RUNNER_TEMP}/packet-kit/." /opt/auths-packet-kit/
          sudo -n cp -R "${RUNNER_TEMP}/packet-consumer/." /opt/auths-packet-consumer/
          sudo -n chmod -R a+rX /opt/auths-packet-kit /opt/auths-packet-consumer
          sudo -n /opt/auths-packet-consumer/bin/python \
            /opt/auths-packet-kit/qualification/reference/check_socket.py \
            --gateway "${RUNNER_TEMP}/packet-candidate/bin/auths-gateway" \
            --python /opt/auths-packet-consumer/bin/python \
            --work "/tmp/auths-socket-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --report "${RUNNER_TEMP}/socket-report/report.json"
          sudo -n cp "${RUNNER_TEMP}/socket-report/report.json" "${RUNNER_TEMP}/packet-operator/socket-report.json"
          sudo -n chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/packet-operator/socket-report.json"
      - name: Exercise the private root controller transport without credentials
        shell: bash
        run: |
          sudo -n /opt/auths-packet-consumer/bin/python -B -m unittest discover \
            -s /opt/auths-packet-kit/qualification/reference/tests -p test_controller_socket.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-packet-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packet-operator/report.json
            ${{ runner.temp }}/packet-operator/socket-report.json
          if-no-files-found: error
          retention-days: 30

  typescript-consumer:
    name: installed TypeScript qualification consumer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
        working-directory: bindings/typescript
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build
        working-directory: bindings/typescript
      - run: mkdir -p target/qualification-typescript
      - run: npm pack --pack-destination ../../target/qualification-typescript
        working-directory: bindings/typescript
      - name: Inspect the actually installed tarball without checkout imports or credentials
        shell: bash
        run: |
          set -euo pipefail
          consumer="${RUNNER_TEMP}/qualification-typescript-consumer"
          npm install --ignore-scripts --no-audit --no-fund --prefix "${consumer}" \
            "${GITHUB_WORKSPACE}"/target/qualification-typescript/auths-dev-sdk-*.tgz
          cp qualification/reference/installed_submit.mjs "${consumer}/installed_submit.mjs"
          cd "${consumer}"
          env -i PATH="${PATH}" node installed_submit.mjs inspect \
            > "${GITHUB_WORKSPACE}/target/qualification-typescript/consumer-report.json"
      - name: Bind the exact tarball and consumer to this source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('target/qualification-typescript')
          packages = list(root.glob('*.tgz'))
          assert len(packages) == 1
          report = json.loads((root / 'consumer-report.json').read_bytes())
          assert report['repository_imported'] is False and report['provider_token_received'] is False
          (root / 'package.json').write_text(json.dumps({
              'schema': 'auths.qualification-installed-package/1', 'source_commit': os.environ['SOURCE_COMMIT'],
              'name': report['package_name'], 'version': report['version'], 'file': packages[0].name,
              'sha256': hashlib.sha256(packages[0].read_bytes()).hexdigest(),
              'qualification_issued': False,
          }, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification-typescript
          if-no-files-found: error
          retention-days: 30

  simulation:
    name: disposable bootstrap and two provider simulations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check the independent resource and request references
        run: python -m unittest discover -s qualification/reference/tests
      - name: Build the portable simulation harness
        run: |
          mkdir -p target
          cargo test --locked -p auths-gateway --features loopback-provider --lib --no-run --message-format=json > target/qualification-harness-build.jsonl
          python qualification/simulation/pack.py --build-report target/qualification-harness-build.jsonl --out target/qualification-candidate-kit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-simulation-kit-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification-candidate-kit
          if-no-files-found: error
          retention-days: 30
      - name: Run with no checkout, credentials or network
        run: |
          docker build -t auths-qualification-simulation qualification/simulation
          mkdir -p target/qualification-simulation-reports
          docker run --rm --network none \
            --mount type=bind,src="$PWD/target/qualification-candidate-kit",dst=/candidate,readonly \
            --mount type=bind,src="$PWD/target/qualification-simulation-reports",dst=/reports \
            auths-qualification-simulation \
            python3 /candidate/run.py --candidate-kit /candidate --out /reports/run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/qualification-simulation-reports/run
          if-no-files-found: error
          retention-days: 30

  families:
    name: list the families
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          list="$(find qualification/families -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
            | sort | jq -R . | jq -cs .)"
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          echo "families: ${list}"

  offline:
    name: candidate and offline evidence (${{ matrix.family }})
    needs: [families, candidate]
    if: needs.families.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        family: ${{ fromJSON(needs.families.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the exact SDK wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install maturin==1.9.6
          maturin build --profile python-extension --locked \
            --manifest-path bindings/python/Cargo.toml --out target/qualification-offline-wheels
          python -m venv "${RUNNER_TEMP}/offline-consumer"
          "${RUNNER_TEMP}/offline-consumer/bin/python" -m pip install target/qualification-offline-wheels/*.whl
          mkdir -p "${RUNNER_TEMP}/offline-author-kit"
          cp qualification/reference/*.py "${RUNNER_TEMP}/offline-author-kit/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qualification-shipping-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Run offline stages on the exact shipping candidate
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          chmod +x "${RUNNER_TEMP}/candidate/bin/"*
          export AUTHS_GATEWAY="${RUNNER_TEMP}/candidate/bin/auths-gateway"
          export AUTHS_QUALIFICATION="${RUNNER_TEMP}/candidate/bin/auths-qualification"
          export AUTHS_QUALIFICATION_CONSUMER_PYTHON="${RUNNER_TEMP}/offline-consumer/bin/python"
          export AUTHS_QUALIFICATION_AUTHOR_KIT="${RUNNER_TEMP}/offline-author-kit"
          wheels=("${GITHUB_WORKSPACE}"/target/qualification-offline-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          export AUTHS_QUALIFICATION_WHEEL="${wheels[0]}"
          qualification/run/offline.sh "${FAMILY}" "${RUNNER_TEMP}/work"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-${{ matrix.family }}
          path: ${{ runner.temp }}/work
          if-no-files-found: error
          retention-days: 30

  live:
    # Disposable provider resources, through the candidate gateway. Each
    # family has its own protected environment holding only that family's
    # qualification credential, which is not a production credential.
    name: live evidence (${{ matrix.family }})
    needs: [families, candidate, offline]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: recipe-qualification-live-${{ matrix.family }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        family: ${{ fromJSON(needs.families.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Build the release tool from this commit
        run: cargo build --locked --release -p auths-recipe-qualification-issuance --bin auths-qualification
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: offline-${{ matrix.family }}
          path: ${{ runner.temp }}/work
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qualification-shipping-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Run the family's live harness
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          AUTHS_QUALIFICATION_PROVIDER_CREDENTIAL: ${{ secrets.QUALIFICATION_PROVIDER_CREDENTIAL }}
        run: |
          set -euo pipefail
          chmod +x "${RUNNER_TEMP}/candidate/bin/"*
          export AUTHS_GATEWAY="${RUNNER_TEMP}/candidate/bin/auths-gateway"
          export AUTHS_QUALIFICATION="${GITHUB_WORKSPACE}/target/release/auths-qualification"
          bash qualification/run/resource-session.sh "${FAMILY}" "${RUNNER_TEMP}/work" \
            bash qualification/run/live.sh "${FAMILY}" "${RUNNER_TEMP}/work"
      - name: Close and scan the final proposal after successful cleanup
        # The resource session has exited successfully, including its cleanup.
        # Keep the real canaries while rebuilding the complete redaction
        # evidence, then scan the actual final proposal before any upload.
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          chmod 0700 "${RUNNER_TEMP}/work"
          python3 -B qualification/run/close_proposal.py \
            --family "${FAMILY}" --work "${RUNNER_TEMP}/work" \
            --environment "recipe-qualification-live-${FAMILY}" --run "${RUN}" \
            --tool "${GITHUB_WORKSPACE}/target/release/auths-qualification"
          test ! -e "${RUNNER_TEMP}/work/canaries"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proposal-${{ matrix.family }}
          path: ${{ runner.temp }}/work/proposal
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-operator-report-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/work
          if-no-files-found: error
          retention-days: 30

  sign:
    # The only job that holds the release signer's key. It waits for a
    # required reviewer of its environment, re-verifies every record's
    # evidence closure, attests each record, and signs one index listing
    # exactly this run's records. It signs nothing else.
    name: sign the release
    needs: live
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: recipe-qualification-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Build the release tool from this commit
        run: cargo build --locked --release -p auths-recipe-qualification-issuance --bin auths-qualification
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: proposal-*
          path: ${{ runner.temp }}/proposals
      - name: Sign every proposal into one release
        shell: bash
        env:
          QUALIFICATION_RELEASE_SIGNER_KEY: ${{ secrets.QUALIFICATION_RELEASE_SIGNER_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for required in qualification-trust-root.json signer-certificate.json revocation-list.json; do
            test -s "qualification/trust/${required}" \
              || { echo "qualification.trust-not-published ${required}" >&2; exit 1; }
          done
          key="${RUNNER_TEMP}/release-signer.key"
          trap 'rm -f "${key}"' EXIT
          printf '%s' "${QUALIFICATION_RELEASE_SIGNER_KEY}" > "${key}"
          # The key is given only to the tool this job built from the
          # reviewed commit, never to a binary another job produced.
          tool="${GITHUB_WORKSPACE}/target/release/auths-qualification"
          arguments=()
          for proposal in "${RUNNER_TEMP}"/proposals/proposal-*; do
            arguments+=(--proposal-dir "${proposal}")
          done
          "${tool}" sign "${arguments[@]}" --signer-key "${key}" \
            --certificate qualification/trust/signer-certificate.json \
            --out-dir "${RUNNER_TEMP}/release"
          cp qualification/trust/revocation-list.json "${RUNNER_TEMP}/release/revocation-list.json"
          mkdir -p "${RUNNER_TEMP}/release-inputs"
          for proposal in "${RUNNER_TEMP}"/proposals/proposal-*; do
            cp "${proposal}/tuple.json" "${RUNNER_TEMP}/release-inputs/$(basename "${proposal}").tuple.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 90

  verify:
    name: verify as a gateway would
    needs: sign
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Build the release tool from this commit
        run: cargo build --locked --release -p auths-recipe-qualification-issuance --bin auths-qualification
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed
      - name: Verify every family under the pinned root
        shell: bash
        run: |
          set -euo pipefail
          tool="${GITHUB_WORKSPACE}/target/release/auths-qualification"
          for tuple in "${RUNNER_TEMP}"/signed/release-inputs/*.tuple.json; do
            "${tool}" verify --root qualification/trust/qualification-trust-root.json \
              --release-dir "${RUNNER_TEMP}/signed/release" --deployment "${tuple}"
            "${tool}" stage-freshness --root qualification/trust/qualification-trust-root.json \
              --release-dir "${RUNNER_TEMP}/signed/release" --deployment "${tuple}" \
              --out "${RUNNER_TEMP}/freshness.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-release
          path: ${{ runner.temp }}/signed/release
          if-no-files-found: error
          retention-days: 90

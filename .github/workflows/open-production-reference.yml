name: Open production reference

on:
  pull_request:
    paths:
      - "product/runtime/auths-node/**"
      - "product/runtime/auths-production-client/**"
      - "product/runtime/auths-runtime/**"
      - "product/stores/auths-stores/**"
      - "product/integrations/auths-custody*/**"
      - "product/integrations/auths-opentofu/**"
      - "product/integrations/auths-postgresql/**"
      - "product/integrations/auths-github/**"
      - "product/operations/**"
      - "bindings/typescript/**"
      - "bindings/python/**"
      - "demos/open-production-reference/**"
      - ".github/workflows/open-production-reference.yml"
  push:
    branches: [main]
    paths:
      - "product/runtime/auths-node/**"
      - "demos/open-production-reference/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-production-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-and-policy:
    name: node, container, and deployment policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Test the shipping node
        run: cargo test --locked -p auths-node
      - name: Check static deployment policy
        run: sh demos/open-production-reference/tests/static-policy.sh
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize demos/open-production-reference/deploy/kubernetes/overlays/local >/tmp/auths-local.yaml
          kubectl kustomize demos/open-production-reference/deploy/kubernetes/overlays/aws-kms >/tmp/auths-aws-kms.yaml
          grep -q "replicas: 3" /tmp/auths-local.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/auths-aws-kms.yaml
      - name: Validate local composition
        env:
          AUTHS_LOCAL_SEED: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
        run: docker compose -f demos/open-production-reference/compose/compose.yaml config >/dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build hardened image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: .
          file: demos/open-production-reference/Dockerfile
          push: false
          tags: auths-node:ci
          outputs: type=oci,dest=/tmp/auths-node.oci.tar
          provenance: mode=max
          sbom: true
      - name: Require the attested OCI artifact
        run: test -s /tmp/auths-node.oci.tar

  local-reference:
    name: three-node local reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHS_LOCAL_SEED: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate isolated TLS material
        run: sh demos/open-production-reference/tests/generate-local-certificates.sh
      - name: Generate the local-fixture trusted context
        run: sh demos/open-production-reference/tests/generate-local-context.sh
      - name: Start the reference stack
        run: docker compose -f demos/open-production-reference/compose/compose.yaml up -d --build --wait
      - name: Verify health and readiness
        run: sh demos/open-production-reference/tests/compose-smoke.sh
      - name: Build installed client artifacts
        run: |
          npm ci --prefix bindings/typescript
          cargo install wasm-pack --version 0.15.0 --locked
          npm run --prefix bindings/typescript build:wasm
          npm run --prefix bindings/typescript build
          mkdir -p target/open-reference-artifacts target/open-reference-consumer
          npm pack ./bindings/typescript --pack-destination "$PWD/target/open-reference-artifacts"
          python -m venv .reference-venv
          .reference-venv/bin/python -m pip install maturin==1.9.6 pytest==9.0.2 pytest-asyncio==1.3.0
          .reference-venv/bin/maturin build --profile python-extension --locked --manifest-path bindings/python/Cargo.toml --out target/open-reference-artifacts
          cargo build --locked -p auths-node \
            --bin auths-node --bin auths-local-context --bin auths-local-authority
      - name: Run packed TypeScript client across replicas
        working-directory: target/open-reference-consumer
        env:
          AUTHS_REFERENCE_ENDPOINT: https://localhost:8443
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/demos/open-production-reference/compose/postgres/certs/ca.crt
        run: |
          cp ../../demos/open-production-reference/tests/installed-sdk-e2e.mjs reference.mjs
          npm init --yes
          npm install ../open-reference-artifacts/auths-dev-sdk-*.tgz
          PATH="${{ github.workspace }}/target/debug:$PATH" node reference.mjs
      - name: Capture node logs on client failure
        if: failure()
        run: |
          docker compose -f demos/open-production-reference/compose/compose.yaml \
            logs --tail 80 auths-1 auths-2 auths-3 || true
      - name: Run built Python wheel across replicas
        env:
          AUTHS_REFERENCE_ENDPOINT: https://localhost:8443
          SSL_CERT_FILE: ${{ github.workspace }}/demos/open-production-reference/compose/postgres/certs/ca.crt
        run: |
          .reference-venv/bin/python -m pip install target/open-reference-artifacts/auths-*.whl
          PATH="$PWD/target/debug:$PATH" .reference-venv/bin/pytest -q demos/open-production-reference/tests/test_installed_sdk.py
      - name: Preserve failure logs
        if: failure()
        run: docker compose -f demos/open-production-reference/compose/compose.yaml logs --no-color
      - name: Stop the reference stack
        if: always()
        run: docker compose -f demos/open-production-reference/compose/compose.yaml down --volumes

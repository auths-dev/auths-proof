name: Sigstore keyless live compatibility

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Produce ephemeral Fulcio and Rekor evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p auths-sigstore-bundle-import
          printf '%s' 'AUTHS-SIGSTORE-COMPATIBILITY-PREIMAGE-v1' > signing-preimage.bin
          cosign sign-blob --yes --bundle sigstore-bundle.json signing-preimage.bin
          cargo run -p auths-sigstore-bundle-import -- sigstore-bundle.json imported-evidence
      - name: Verify deterministic offline boundaries
        run: cargo test -p auths-sigstore-keyless -p auths-sigstore-bundle-import
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigstore-keyless-redacted-evidence
          path: imported-evidence

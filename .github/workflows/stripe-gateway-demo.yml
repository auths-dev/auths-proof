name: Stripe gateway demo

on:
  pull_request:
    paths:
      - 'demos/stripe-gateway/**'
      - 'bindings/python/**'
      - 'bindings/typescript/**'
      - 'bindings/wasm/**'
      - 'qualification/reference/**'
      - 'qualification/security_assessment/**'
      - 'qualification/simulation/live/stripe-platform/**'
      - 'product/**'
      - 'core/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/stripe-gateway-demo.yml'
  push:
    branches: [main]
    paths:
      - 'demos/stripe-gateway/**'
      - 'product/**'
      - '.github/workflows/stripe-gateway-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-gateway-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Build installed SDK inputs and distinct shipping/simulation gateways
        run: |
          mkdir -p target/stripe-demo
          python -m venv .stripe-demo-venv
          .stripe-demo-venv/bin/pip install maturin==1.9.6
          .stripe-demo-venv/bin/maturin build --profile python-extension --locked \
            --manifest-path bindings/python/Cargo.toml --out target/stripe-demo
          cargo build --locked --release -p auths-gateway --bin auths-gateway
          cp target/release/auths-gateway target/stripe-demo/auths-gateway
          cargo build --locked --release -p auths-gateway --features loopback-provider --bin auths-gateway
          cp target/release/auths-gateway target/stripe-demo/auths-gateway-simulation
      - run: npm ci
        working-directory: bindings/typescript
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run build:wasm
        working-directory: bindings/typescript
      - run: npm run build
        working-directory: bindings/typescript
      - run: npm pack --pack-destination ../../target/stripe-demo
        working-directory: bindings/typescript
      - name: Compile the public TypeScript client against the packed SDK
        run: |
          cp -R demos/stripe-gateway "$RUNNER_TEMP/stripe-client"
          cd "$RUNNER_TEMP/stripe-client"
          npm install --ignore-scripts --no-save --no-audit --no-fund "$GITHUB_WORKSPACE"/target/stripe-demo/auths-dev-sdk-*.tgz
          npm run build
          node --check web/app.js
          npm run test:web
      - name: Verify private live launcher boundaries
        run: python demos/stripe-gateway/tests/test_launch.py
      - name: Construct the source-free demo handoff
        run: |
          python demos/stripe-gateway/tools/package.py \
            --gateway target/stripe-demo/auths-gateway \
            --simulation-gateway target/stripe-demo/auths-gateway-simulation \
            --wheel target/stripe-demo/auths-*.whl --npm target/stripe-demo/auths-dev-sdk-*.tgz \
            --compiled-client "$RUNNER_TEMP/stripe-client/build/submit.mjs" \
            --commit "$(git rev-parse HEAD)" --output target/stripe-demo/stripe-gateway-demo.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stripe-gateway-demo-package
          path: |
            target/stripe-demo/stripe-gateway-demo.tgz
            target/stripe-demo/stripe-gateway-demo.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  installed-demo:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout in this job: Docker receives only the reviewed handoff.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stripe-gateway-demo-package
          path: package
      - name: Verify and install every handed-off payload
        run: |
          cd package
          sha256sum -c stripe-gateway-demo.tgz.sha256
          tar xzf stripe-gateway-demo.tgz
          cd stripe-gateway-demo
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text())
          assert manifest['schema']=='auths.stripe-gateway-demo-package/1'
          assert manifest['production_qualification'] is False
          for item in manifest['files']:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['sha256']
          assert not list(Path('.').rglob('*.rs'))
          PY
          docker build -t auths-stripe-gateway-demo .
      - name: Measure the isolated native journey and audit
        run: |
          mkdir -p evidence
          docker run --rm --init -v "$PWD/evidence:/evidence" auths-stripe-gateway-demo --selftest
      - name: Inspect the actual browser workbench and evidence
        run: |
          docker run -d --init --name stripe-workbench -p 127.0.0.1:8080:8080 auths-stripe-gateway-demo
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/status >/dev/null; then break; fi
            sleep 1
          done
          sudo mkdir -p /evidence
          sudo chmod 777 /evidence
          python3 package/stripe-gateway-demo/tests/browser.py
          cp /evidence/*.png evidence/
      - name: Stop the packaged operator
        if: always()
        run: docker stop --time 30 stripe-workbench || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: stripe-gateway-demo-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  adversarial-assessment:
    name: adversarial transport and baseline experiments
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stripe-gateway-demo-package
          path: target/ap075-package
      - name: Verify evidence-census mutation controls
        run: |
          python3 -m unittest discover -s qualification/security_assessment -p 'test_*.py'
          python3 qualification/security_assessment/report.py --verify \
            --output docs/reviews/0075-security-boundary-assessment
      - name: Verify source-free package and build restricted laboratory
        run: |
          cd target/ap075-package
          sha256sum -c stripe-gateway-demo.tgz.sha256
          tar xzf stripe-gateway-demo.tgz
          docker build -f "$GITHUB_WORKSPACE/qualification/security_assessment/Dockerfile" \
            -t auths-ap075-stripe stripe-gateway-demo
      - name: Execute actual restricted-UID attacks and conventional baseline
        env:
          AUTHS_ASSESSMENT_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p target/ap075-evidence
          failures=0
          for suite in boundary reference operations; do
            mkdir -p "target/ap075-evidence/$suite"
            driver=(/assessment/stripe_probe.py --suite "$suite")
            if [[ "$suite" == operations ]]; then
              driver=(/assessment/operations.py)
            fi
            if ! docker run --rm --init --network none --cap-add NET_ADMIN \
              --add-host api.stripe.com:1.1.1.1 \
              --security-opt no-new-privileges --memory 1g --cpus 2 --pids-limit 256 \
              --tmpfs /run:rw,nosuid,nodev,size=128m \
              -e AUTHS_ASSESSMENT_TARGET_SHA \
              -v "$GITHUB_WORKSPACE/qualification/security_assessment:/assessment:ro" \
              -v "$GITHUB_WORKSPACE/target/ap075-evidence/$suite:/evidence" \
              auths-ap075-stripe "${driver[@]}"; then
              failures=$((failures + 1))
            fi
          done
          mkdir -p target/ap075-evidence/comparison
          if ! docker run --rm --init --network none --security-opt no-new-privileges \
            --memory 512m --cpus 2 --pids-limit 128 \
            -v "$GITHUB_WORKSPACE/qualification/security_assessment:/assessment:ro" \
            -v "$GITHUB_WORKSPACE/target/ap075-evidence/comparison:/evidence" \
            auths-ap075-stripe /assessment/compare.py; then
            failures=$((failures + 1))
          fi
          if ! python3 qualification/security_assessment/validate.py \
            --boundary target/ap075-evidence/boundary/independent-stripe.json \
            --comparison target/ap075-evidence/comparison/baseline-comparison.json \
            --operations target/ap075-evidence/operations/operations.json \
            --head "$AUTHS_ASSESSMENT_TARGET_SHA" --output target/ap075-evidence/census.json; then
            failures=$((failures + 1))
          fi
          exit "$failures"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap075-adversarial-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ap075-evidence/
          if-no-files-found: error
          retention-days: 30

name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - target_codec
          - target_portable_codecs
          - target_model_state
          - target_composition
          - target_registry_handlers
          - target_principal_parsers
          - target_portable_abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: nightly-2026-07-20
          compiler-cache: "false"
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: cargo xtask fuzz-inventory
      - run: cargo fuzz run ${{ matrix.target }} --manifest-path core/fuzz/Cargo.toml -- -max_total_time=300 -artifact_prefix=artifacts/${{ matrix.target }}/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

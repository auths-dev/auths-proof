name: Gateway isolation

on:
  pull_request:
    paths:
      - .github/workflows/gateway-isolation.yml
      - bindings/fixtures/gateway/**
      - product/runtime/auths-gateway/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distinct-uid:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Probe actual app UID against gateway credential and admin socket
        run: cargo test --locked -p auths-gateway --test isolated_process -- --ignored --nocapture

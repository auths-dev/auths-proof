name: Gateway isolation

on:
  pull_request:
    paths:
      - .github/workflows/gateway-isolation.yml
      - bindings/fixtures/gateway/**
      - product/runtime/auths-gateway/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-isolation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  distinct-uid:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Probe actual app UID against gateway credential and admin socket
        run: cargo test --locked -p auths-gateway --test isolated_process -- --ignored --nocapture
      - name: Exercise every managed application schema from a distinct unprivileged UID
        env:
          AUTHS_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo test --locked -p auths-gateway --features loopback-provider,testkit-harness --test content_journey -- --ignored --exact interface_tests::distinct_uid_managed_interface_evidence --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-managed-interface-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ap074-managed-interface-isolation.json
          if-no-files-found: error
          retention-days: 30

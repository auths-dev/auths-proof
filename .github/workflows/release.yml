name: Auths release control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare twice or promote one previously staged manifest
        type: choice
        options:
          - prepare
          - promote-github-prerelease
        required: true
      candidate_commit:
        description: Full candidate commit SHA on main
        type: string
        required: true
      candidate_tag:
        description: Immutable Auths RC tag
        type: string
        required: true
      preparation_run_id:
        description: Required only for promotion
        type: string
        required: false
      manifest_sha256:
        description: Exact approved manifest digest; required only for promotion
        type: string
        required: false
      owner_authorization_sha256:
        description: Digest of the repository-owner authorization record; required only for promotion
        type: string
        required: false
      owner_authorization_base64:
        description: Canonical owner-authorization JSON encoded as one-line base64; required only for promotion
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: auths-release-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  preparation-entry-gate:
    name: verify preparation environment and immutable OIDC policy
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - name: Verify exact main candidate and workspace tag
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_COMMIT" ]]
          [[ "$DISPATCH_REF" == "refs/heads/main" ]]
          [[ "$CANDIDATE_COMMIT" == "$DISPATCH_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ "$CANDIDATE_TAG" == "auths-v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" ]]
      - name: Refuse absent or unprotected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/auths-dev/auths-proof/environments/release-candidate \
            > "$RUNNER_TEMP/release-candidate-environment.json"
          jq -e '.deployment_branch_policy.protected_branches == true or .deployment_branch_policy.custom_branch_policies == true' \
            "$RUNNER_TEMP/release-candidate-environment.json" > /dev/null
      - name: Require immutable repository OIDC subject opt-in
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/auths-dev/auths-proof/actions/oidc/customization/sub \
            > "$RUNNER_TEMP/oidc-subject.json"
          jq -e '.use_immutable_subject == true' "$RUNNER_TEMP/oidc-subject.json" > /dev/null
          [[ "$(jq -r '.sub_claim_prefix' "$RUNNER_TEMP/oidc-subject.json")" == \
            repo:auths-dev@260513770/auths-proof@1310728509 ]]

  official-preparation:
    name: official isolated preparation
    if: inputs.operation == 'prepare'
    needs: preparation-entry-gate
    uses: ./.github/workflows/release-builder.yml
    with:
      candidate_commit: ${{ inputs.candidate_commit }}
      candidate_tag: ${{ inputs.candidate_tag }}
      run_label: official
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

  reproduction-preparation:
    name: independent isolated reproduction
    if: inputs.operation == 'prepare'
    needs: preparation-entry-gate
    uses: ./.github/workflows/release-builder.yml
    with:
      candidate_commit: ${{ inputs.candidate_commit }}
      candidate_tag: ${{ inputs.candidate_tag }}
      run_label: reproduction
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

  compare-and-stage:
    name: compare isolated runs and stage official bytes
    if: inputs.operation == 'prepare'
    needs: [official-preparation, reproduction-preparation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          additional-toolchains: 1.91.0
          compiler-cache: "false"
      - name: Download official preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.official-preparation.outputs.artifact_name }}
          path: target/preparations/official
      - name: Download independent reproduction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.reproduction-preparation.outputs.artifact_name }}
          path: target/preparations/reproduction
      - name: Compare by frozen reproducibility class
        run: >-
          cargo xtask release-control compare
          target/preparations/official/target/release-evidence/release-manifest.json
          target/preparations/reproduction/target/release-evidence/release-manifest.json
          target/preparations/official/target/release-evidence/preparation-comparison.json
      - name: Confirm caller and builder manifest identities agree
        env:
          OFFICIAL_SHA256: ${{ needs.official-preparation.outputs.manifest_sha256 }}
          REPRODUCTION_SHA256: ${{ needs.reproduction-preparation.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$OFFICIAL_SHA256" == "$(cut -d' ' -f1 target/preparations/official/target/release-evidence/release-manifest.sha256)" ]]
          [[ "$REPRODUCTION_SHA256" == "$(cut -d' ' -f1 target/preparations/reproduction/target/release-evidence/release-manifest.sha256)" ]]
      - name: Stage exact official preparation without overwriting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-staged-${{ inputs.candidate_commit }}-${{ needs.official-preparation.outputs.manifest_sha256 }}
          path: target/preparations/official/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
      - name: Record preparation result
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          MANIFEST_SHA256: ${{ needs.official-preparation.outputs.manifest_sha256 }}
        run: |
          {
            echo "Candidate commit: $CANDIDATE_COMMIT"
            echo "Candidate tag: $CANDIDATE_TAG"
            echo "Manifest SHA-256: $MANIFEST_SHA256"
            echo "Preparation is not publication authorization."
            echo "Promotion remains blocked pending exact owner authorization."
          } >> "$GITHUB_STEP_SUMMARY"

  promotion-entry-gate:
    name: verify exact staged candidate and promotion authority
    if: inputs.operation == 'promote-github-prerelease'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          additional-toolchains: 1.91.0
          compiler-cache: "false"
      - name: Require complete immutable promotion inputs
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          OWNER_AUTHORIZATION_SHA256: ${{ inputs.owner_authorization_sha256 }}
          OWNER_AUTHORIZATION_BASE64: ${{ inputs.owner_authorization_base64 }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OWNER_AUTHORIZATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$OWNER_AUTHORIZATION_BASE64" ]]
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DISPATCH_ACTOR_ID" == 3743841 ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_COMMIT" ]]
          [[ "$CANDIDATE_TAG" == "auths-v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" ]]
      - name: Refuse absent or unprotected promotion environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/auths-dev/auths-proof/environments/release-promotion \
            > "$RUNNER_TEMP/release-promotion-environment.json"
          jq -e '[.protection_rules[] | select(.type == "required_reviewers")] | length > 0' \
            "$RUNNER_TEMP/release-promotion-environment.json" > /dev/null
          jq -e '.can_admins_bypass == false' \
            "$RUNNER_TEMP/release-promotion-environment.json" > /dev/null
      - name: Download the exact staged preparation run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: auths-staged-${{ inputs.candidate_commit }}-${{ inputs.manifest_sha256 }}
          path: target/staged
          github-token: ${{ github.token }}
          repository: auths-dev/auths-proof
          run-id: ${{ inputs.preparation_run_id }}
      - name: Create exact promotion request
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          OWNER_AUTHORIZATION_SHA256: ${{ inputs.owner_authorization_sha256 }}
          OWNER_AUTHORIZATION_BASE64: ${{ inputs.owner_authorization_base64 }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_AUTHORIZATION_BASE64" \
            | base64 --decode > target/owner-authorization.json
          [[ "$(sha256sum target/owner-authorization.json | cut -d' ' -f1)" == \
            "$OWNER_AUTHORIZATION_SHA256" ]]
          jq -n \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg tag "$CANDIDATE_TAG" \
            --arg manifest "$MANIFEST_SHA256" \
            --arg authorization "$OWNER_AUTHORIZATION_SHA256" \
            --arg run "$PREPARATION_RUN_ID" \
            '{schema:"auths.promotion-request/1",operation:"promote-prepared-candidate",candidateCommit:$commit,tag:$tag,manifestSha256:$manifest,ownerAuthorizationSha256:$authorization,preparationRunId:$run,destinations:["github-prerelease"]}' \
            > target/promotion-request.json
      - name: Verify promotion without rebuilding
        run: >-
          cargo xtask release-control verify-promotion
          target/staged
          target/promotion-request.json
          target/owner-authorization.json
      - name: Preserve verified promotion input for protected job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-promotion-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/staged/
            target/promotion-request.json
            target/owner-authorization.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  promote-github-prerelease:
    name: promote prepared bytes without rebuilding
    if: inputs.operation == 'promote-github-prerelease'
    needs: promotion-entry-gate
    runs-on: ubuntu-latest
    environment: release-promotion
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified promotion input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: auths-promotion-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/promotion
      - name: Recheck exact manifest and immutable tag state
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          OWNER_AUTHORIZATION_SHA256: ${{ inputs.owner_authorization_sha256 }}
        run: |
          set -euo pipefail
          MANIFEST=target/promotion/staged/target/release-evidence/release-manifest.json
          [[ "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" == "$MANIFEST_SHA256" ]]
          [[ "$(jq -r '.source.commit' "$MANIFEST")" == "$CANDIDATE_COMMIT" ]]
          [[ "$(jq -r '.release.tag' "$MANIFEST")" == "$CANDIDATE_TAG" ]]
          AUTHORIZATION=target/promotion/owner-authorization.json
          PROMOTION_REQUEST=target/promotion/promotion-request.json
          [[ "$(sha256sum "$AUTHORIZATION" | cut -d' ' -f1)" == \
            "$OWNER_AUTHORIZATION_SHA256" ]]
          [[ "$(jq -r '.ownerAuthorizationSha256' "$PROMOTION_REQUEST")" == \
            "$OWNER_AUTHORIZATION_SHA256" ]]
          EXISTING="$(gh api "repos/auths-dev/auths-proof/git/ref/tags/$CANDIDATE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          [[ -z "$EXISTING" || "$EXISTING" == "$CANDIDATE_COMMIT" ]]
          if [[ -z "$EXISTING" ]]; then
            gh api --method POST repos/auths-dev/auths-proof/git/refs \
              -f ref="refs/tags/$CANDIDATE_TAG" \
              -f sha="$CANDIDATE_COMMIT" > /dev/null
          fi
      - name: Create prerelease from staged subjects and evidence only
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST=target/promotion/staged/target/release-evidence/release-manifest.json
          NOTES=target/promotion/staged/target/release-evidence/RELEASE_CANDIDATE_NOTES.md
          AUTHORIZATION=target/promotion/owner-authorization.json
          PROMOTION_REQUEST=target/promotion/promotion-request.json
          mapfile -t SUBJECTS < <(jq -r '.subjects[].name' "$MANIFEST" | sed 's#^#target/promotion/staged/#')
          mapfile -t EVIDENCE < <(find target/promotion/staged/target/release-evidence -type f -print | sort)
          gh release create "$CANDIDATE_TAG" \
            --repo auths-dev/auths-proof \
            --verify-tag \
            --prerelease \
            --title "Auths $CANDIDATE_TAG" \
            --notes-file "$NOTES" \
            "${SUBJECTS[@]}" \
            "${EVIDENCE[@]}" \
            "$AUTHORIZATION" \
            "$PROMOTION_REQUEST"

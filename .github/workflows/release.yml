name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - run: cargo install wasm-bindgen-cli --version 0.2.118 --locked
      - run: cargo +1.85.0 check --workspace --all-targets --all-features
      - name: Run release checks and generate evidence
        id: release_check
        run: cargo xtask release-check
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Preserve release archives and evidence
        if: ${{ always() && steps.release_check.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: auths-proof-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/package/*.crate
            target/release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

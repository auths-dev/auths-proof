name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install locked release tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.118 --locked
          cargo install wasm-pack --version 0.15.0 --locked
          python -m pip install maturin==1.9.6
          npm ci --prefix bindings/typescript
      - name: Run release checks and generate evidence
        id: release_check
        run: cargo xtask release-check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - name: Preserve release archives and evidence
        if: ${{ always() && steps.release_check.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-proof-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/package/*.crate
            target/release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

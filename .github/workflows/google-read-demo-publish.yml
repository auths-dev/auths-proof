name: Google read demo publish

# Publication requires a reviewed main commit and the repository release gate.
# Pull requests, tag pushes, and ordinary branch pushes cannot publish images.
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full reviewed Auths commit SHA on main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: google-read-demo-publish-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish pinned broker, agent and operator kit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Require the reviewed main revision and release gate
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          cargo xtask release-check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the installed SDK wheel from the reviewed revision
        run: |
          python -m pip install maturin==1.9.6
          maturin build --profile python-extension --locked \
            --manifest-path bindings/python/Cargo.toml \
            --out target/google-read-release-wheel
          set -- target/google-read-release-wheel/auths-*.whl
          test "$#" -eq 1
          cp "$1" demos/google-employee-delegation/artifacts/
          echo "AP070_WHEEL_SHA256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Check installed broker and agent packages
        run: |
          python -m venv .ap070-release-venv
          .ap070-release-venv/bin/python -m pip install \
            target/google-read-release-wheel/auths-*.whl \
            ./demos/google-employee-delegation/broker \
            ./demos/google-employee-delegation/agent
          .ap070-release-venv/bin/python -m unittest discover \
            -s demos/google-employee-delegation/broker/tests -q
          .ap070-release-venv/bin/python -m unittest discover \
            -s demos/google-employee-delegation/agent/tests -q
      - name: Build both installed runtime images
        working-directory: demos/google-employee-delegation
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/$owner/auths-proof-google-read"
          echo "AP070_IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
          for role in broker agent; do
            image="$prefix-$role:$GITHUB_SHA"
            if [ "$role" = broker ]; then
              cli=auths-google-read-workbench
            else
              cli=auths-google-read-agent
            fi
            docker build -f Dockerfile --build-arg "AP070_ROLE=$role" \
              --build-arg "AUTHS_WHEEL_SHA256=$AP070_WHEEL_SHA256" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" .
            docker run --rm --entrypoint sh "$image" -c \
              "command -v $cli && test ! -e /build/$role"
          done
      - name: Publish images and pin registry manifests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for role in broker agent; do
            image="$AP070_IMAGE_PREFIX-$role:$GITHUB_SHA"
            docker push "$image"
            digest=$(docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' | \
              python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "invalid registry digest for $role" >&2; exit 1;; esac
            reference="$AP070_IMAGE_PREFIX-$role@$digest"
            docker pull "$reference"
            if [ "$role" = broker ]; then
              echo "AP070_BROKER_REF=$reference" >> "$GITHUB_ENV"
            else
              echo "AP070_AGENT_REF=$reference" >> "$GITHUB_ENV"
            fi
          done
      - name: Assemble and checksum the pinned source-free kit
        run: |
          set -euo pipefail
          set -- target/google-read-release-wheel/auths-*.whl
          test "$#" -eq 1
          python3 demos/google-employee-delegation/tools/release_kit.py \
            --source demos/google-employee-delegation \
            --wheel "$1" --output target/google-read-operator-kit \
            --revision "$GITHUB_SHA" --image-prefix "$AP070_IMAGE_PREFIX" \
            --broker-image "$AP070_BROKER_REF" --agent-image "$AP070_AGENT_REF"
          (cd target/google-read-operator-kit && sha256sum -c SHA256SUMS)
          tar -C target --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -cf - google-read-operator-kit | \
            gzip -n > target/google-read-operator-release.tar.gz
          (cd target && sha256sum google-read-operator-release.tar.gz > \
            google-read-operator-release.tar.gz.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: google-read-operator-release-${{ github.sha }}
          path: |
            target/google-read-operator-release.tar.gz
            target/google-read-operator-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  verify-release:
    name: unpack published kit without source checkout
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: google-read-operator-release-${{ github.sha }}
          path: package
      - name: Check the published artifact and digest lock
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd package
          sha256sum -c google-read-operator-release.tar.gz.sha256
          tar xzf google-read-operator-release.tar.gz
          cd google-read-operator-kit
          sha256sum -c SHA256SUMS
          test "$(cat REVISION)" = "$EXPECTED_REVISION"
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          lock = json.loads(Path('versions.lock.json').read_text())
          sdk = lock['installed_sdk_artifact']
          wheel = Path('artifacts') / sdk['filename']
          assert wheel.is_file()
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == sdk['sha256']
          assert sdk['revision'] == Path('REVISION').read_text().strip()
          for role in ('broker', 'agent'):
              ref = lock[f'{role}_image_digest']
              assert re.fullmatch(
                  rf'ghcr\.io/[a-z0-9-]+/auths-proof-google-read-{role}@sha256:[0-9a-f]{{64}}', ref)
          assert lock['google_live_status'] == 'not_configured'
          PY

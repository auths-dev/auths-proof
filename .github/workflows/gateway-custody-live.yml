name: Gateway custody live

# Runs the Secrets Manager credential store against the protected account.
# The job waits for a required reviewer of the `gateway-custody-live`
# environment, then assumes two roles through this repository's identity
# token. No access key is stored anywhere.
on:
  pull_request:
    paths:
      - "product/integrations/auths-credentials-aws-secrets-manager/**"
      - ".github/workflows/gateway-custody-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gateway-custody-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gateway-custody-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Request the workload identity token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file="${RUNNER_TEMP}/custody-identity-token"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "${token_file}"
          test -s "${token_file}"
          echo "AUTHS_CUSTODY_LIVE_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"
      - name: Preflight the roles with the service's own client
        # Shows the service's own error when a role cannot be assumed or a
        # secret cannot be created, which the store deliberately does not.
        # It prints role names and error text only, never a credential.
        shell: bash
        env:
          AWS_REGION: eu-west-1
          OPERATOR_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-operator
          RUNTIME_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-runtime
          KMS_KEY: arn:aws:kms:eu-west-1:585985124542:key/1e1c85ae-7d9c-4f2d-978f-bd672b597907
          SECRET_NAME: auths-gateway/preflight-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          assume() {
            aws sts assume-role-with-web-identity --role-arn "$1" \
              --role-session-name custody-preflight --duration-seconds 900 \
              --web-identity-token "file://${AUTHS_CUSTODY_LIVE_TOKEN_FILE}" \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
          }
          echo "runtime role:"; assume "${RUNTIME_ROLE}" >/dev/null && echo "  assumable"
          echo "operator role:"
          read -r key secret token < <(assume "${OPERATOR_ROLE}") || { echo "  not assumable"; exit 0; }
          echo "  assumable"
          export AWS_ACCESS_KEY_ID="${key}" AWS_SECRET_ACCESS_KEY="${secret}" AWS_SESSION_TOKEN="${token}"
          version="$(printf 'preflight' | sha256sum | cut -d' ' -f1)"
          echo "create with a 64-character version identifier:"
          aws secretsmanager create-secret --name "${SECRET_NAME}" --kms-key-id "${KMS_KEY}" \
            --client-request-token "${version}" --secret-binary "cHJlZmxpZ2h0" \
            --query 'VersionId' --output text || true
          aws secretsmanager delete-secret --secret-id "${SECRET_NAME}" \
            --force-delete-without-recovery --query 'Name' --output text || true
      - name: Run the store contract against the service
        env:
          AUTHS_CUSTODY_LIVE_REGION: eu-west-1
          AUTHS_CUSTODY_LIVE_NAMESPACE: live-${{ github.run_id }}-${{ github.run_attempt }}
          AUTHS_CUSTODY_LIVE_KMS_KEY: arn:aws:kms:eu-west-1:585985124542:key/1e1c85ae-7d9c-4f2d-978f-bd672b597907
          AUTHS_CUSTODY_LIVE_OPERATOR_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-operator
          AUTHS_CUSTODY_LIVE_RUNTIME_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-runtime
        run: cargo test -p auths-credentials-aws-secrets-manager --test live -- --ignored
      - name: Remove the identity token
        if: always()
        run: rm -f "${RUNNER_TEMP}/custody-identity-token"

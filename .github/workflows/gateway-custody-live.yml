name: Gateway custody live

# Runs the Secrets Manager credential store against the protected account.
# The job waits for a required reviewer of the `gateway-custody-live`
# environment, then assumes two roles through this repository's identity
# token. No access key is stored anywhere.
on:
  pull_request:
    paths:
      - "product/integrations/auths-credentials-aws-secrets-manager/**"
      - "examples/stripe-refund-approval/journey.py"
      - ".github/workflows/gateway-custody-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gateway-custody-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gateway-custody-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Request the workload identity token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file="${RUNNER_TEMP}/custody-identity-token"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "${token_file}"
          test -s "${token_file}"
          echo "AUTHS_CUSTODY_LIVE_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"
      - name: Preflight the roles with the service's own client
        # Shows the service's own error when a role cannot be assumed or a
        # secret cannot be created, which the store deliberately does not.
        # It prints role names and error text only, never a credential.
        shell: bash
        env:
          AWS_REGION: eu-west-1
          OPERATOR_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-operator
          RUNTIME_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-runtime
          KMS_KEY: arn:aws:kms:eu-west-1:585985124542:key/1e1c85ae-7d9c-4f2d-978f-bd672b597907
          SECRET_NAME: auths-gateway/preflight-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          assume() {
            aws sts assume-role-with-web-identity --role-arn "$1" \
              --role-session-name custody-preflight --duration-seconds 900 \
              --web-identity-token "file://${AUTHS_CUSTODY_LIVE_TOKEN_FILE}" \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
          }
          echo "runtime role:"; assume "${RUNTIME_ROLE}" >/dev/null && echo "  assumable"
          echo "operator role:"
          read -r key secret token < <(assume "${OPERATOR_ROLE}") || { echo "  not assumable"; exit 0; }
          echo "  assumable"
          export AWS_ACCESS_KEY_ID="${key}" AWS_SECRET_ACCESS_KEY="${secret}" AWS_SESSION_TOKEN="${token}"
          version="$(printf 'preflight' | sha256sum | cut -d' ' -f1)"
          echo "create with a 64-character version identifier:"
          aws secretsmanager create-secret --name "${SECRET_NAME}" --kms-key-id "${KMS_KEY}" \
            --client-request-token "${version}" --secret-binary "cHJlZmxpZ2h0" \
            --query 'VersionId' --output text || true
          aws secretsmanager delete-secret --secret-id "${SECRET_NAME}" \
            --force-delete-without-recovery --query 'Name' --output text || true
      - name: Run the store contract against the service
        env:
          AUTHS_CUSTODY_LIVE_REGION: eu-west-1
          AUTHS_CUSTODY_LIVE_NAMESPACE: live-${{ github.run_id }}-${{ github.run_attempt }}
          AUTHS_CUSTODY_LIVE_KMS_KEY: arn:aws:kms:eu-west-1:585985124542:key/1e1c85ae-7d9c-4f2d-978f-bd672b597907
          AUTHS_CUSTODY_LIVE_OPERATOR_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-operator
          AUTHS_CUSTODY_LIVE_RUNTIME_ROLE: arn:aws:iam::585985124542:role/auths-gateway-custody-runtime
        run: cargo test -p auths-credentials-aws-secrets-manager --test live -- --ignored
      - name: Remove the identity token
        if: always()
        run: rm -f "${RUNNER_TEMP}/custody-identity-token"

  gateway-journey:
    # A real gateway whose provider secret lives in the production store:
    # the north-star refund journey, hostile cases included, with the key
    # installed into Secrets Manager and leased from it for every write.
    # The provider is the counting Stripe double, so no provider call
    # leaves the runner.
    name: gateway journey on the production credential store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gateway-custody-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m venv .journey-venv
      - run: .journey-venv/bin/python -m pip install maturin==1.9.6
      - run: >-
          .journey-venv/bin/maturin build --profile python-extension --locked
          --manifest-path bindings/python/Cargo.toml
          --out target/journey-artifacts
      - run: .journey-venv/bin/python -m pip install target/journey-artifacts/auths-*.whl
      - run: cargo build --locked -p auths-gateway --features loopback-provider --bin auths-gateway
      - name: Run the journey with the key in Secrets Manager
        shell: bash
        working-directory: examples/stripe-refund-approval
        env:
          AWS_ROLE_ARN: arn:aws:iam::585985124542:role/auths-gateway-custody-gateway
          NAMESPACE: journey-${{ github.run_id }}-${{ github.run_attempt }}
          KMS_KEY: arn:aws:kms:eu-west-1:585985124542:key/1e1c85ae-7d9c-4f2d-978f-bd672b597907
        run: |
          set -euo pipefail
          umask 077
          export AWS_WEB_IDENTITY_TOKEN_FILE="${RUNNER_TEMP}/journey-identity-token"
          refresh() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
              | jq -r '.value' > "${AWS_WEB_IDENTITY_TOKEN_FILE}.next"
            mv "${AWS_WEB_IDENTITY_TOKEN_FILE}.next" "${AWS_WEB_IDENTITY_TOKEN_FILE}"
          }
          refresh
          # The identity token is short-lived; keep a fresh one for every
          # gateway process the journey starts.
          ( while sleep 60; do refresh || true; done ) &
          refresher=$!
          trap 'kill "${refresher}" 2>/dev/null || true; rm -f "${AWS_WEB_IDENTITY_TOKEN_FILE}"' EXIT
          export AUTHS_JOURNEY_INSTALL_ARGS="$(jq -cn --arg namespace "${NAMESPACE}" --arg key "${KMS_KEY}" \
            '["--credential-store","aws-secrets-manager-v1","--credential-namespace",$namespace,"--aws-region","eu-west-1","--aws-kms-key",$key,"--aws-identity","web-identity"]')"
          ../../.journey-venv/bin/python journey.py \
            --gateway "${GITHUB_WORKSPACE}/target/debug/auths-gateway" \
            --summary "${GITHUB_WORKSPACE}/target/journey-artifacts/custody-journey-summary.json"
          jq -e '.credential_store == "aws-secrets-manager-v1"' \
            "${GITHUB_WORKSPACE}/target/journey-artifacts/custody-journey-summary.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: custody-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/journey-artifacts/custody-journey-summary.json
          if-no-files-found: warn
          retention-days: 30


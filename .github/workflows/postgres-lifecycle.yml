name: PostgreSQL lifecycle qualification

on:
  pull_request:
    paths:
      - "product/runtime/auths-lifecycle/**"
      - "product/runtime/auths-gateway/**"
      - "product/integrations/auths-records-api/**"
      - "demos/rest-api-authorization/**"
      - "product/stores/auths-stores/**"
      - "bindings/fixtures/gateway/**"
      - "qualification/reference/ap074_information_differential.py"
      - "qualification/reference/common.py"
      - "qualification/reference/tests/test_ap074_information_differential.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/admission.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/authority.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/contracts.py"
      - "bindings/python/**"
      - ".github/workflows/postgres-lifecycle.yml"
      - "deployment/gateway/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-multi-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Start TLS PostgreSQL
        run: docker compose -f product/stores/auths-stores/tests/postgres_tls/compose.yaml up -d --wait
      - name: Run multi-host lifecycle evidence
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
        run: cargo test -p auths-stores --test postgres_lifecycle -- --ignored
      - name: Run gateway attempt-store conformance and hostile suites
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
        run: |
          set -o pipefail
          mkdir -p target
          {
          failures=0
          cargo test -p auths-gateway --lib -- --ignored postgres || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --test content_journey -- --exact native_content_process_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_process_tests::native_file_process_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_process_tests::postgres_native_process_capacity_fixture_is_current || failures=$((failures + 1))
          python3 qualification/reference/created_resource.py bindings/fixtures/gateway/engagement/creation-selection.json || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_crash_tests::native_file_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_crash_tests::postgres_native_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_crash_tests::native_file_mutation_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::postgres_native_mutation_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_disclosure_crash_tests::native_file_disclosure_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::postgres_native_disclosure_process_crash_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_dependency_tests::native_file_dependency_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_dependency_tests::postgres_native_dependency_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_budget_tests::native_file_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_budget_tests::postgres_native_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_crash_tests::window_capacity_tests::native_file_mutation_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::window_capacity_tests::postgres_native_mutation_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_disclosure_crash_tests::window_capacity_tests::native_file_disclosure_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::window_capacity_tests::postgres_native_disclosure_window_capacity_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_file_fault_tests::native_file_io_fault_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_crash_tests::window_capacity_tests::file_fault_tests::native_file_mutation_io_fault_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_disclosure_crash_tests::file_fault_tests::native_file_disclosure_io_fault_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_postgres_fault_tests::postgres_native_partial_batch_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::window_capacity_tests::postgres_batch_tests::postgres_native_mutation_partial_batch_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::postgres_batch_tests::postgres_native_disclosure_partial_batch_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_postgres_commit_tests::postgres_native_commit_reply_loss_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::window_capacity_tests::postgres_commit_tests::postgres_native_mutation_commit_reply_loss_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::postgres_commit_tests::postgres_native_disclosure_commit_reply_loss_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_replay_tests::native_file_mutation_retained_replay_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_replay_tests::postgres_native_mutation_retained_replay_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::native_file_information_retained_replay_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::postgres_native_information_retained_replay_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::retention_tests::native_file_retention_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::retention_tests::postgres_native_retention_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::epoch_tests::native_file_epoch_fence_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::epoch_tests::postgres_native_epoch_fence_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::scope_tests::native_file_managed_scope_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::scope_tests::postgres_native_managed_scope_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_replay_tests::entry_tests::native_file_mutation_entry_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_replay_tests::entry_tests::postgres_native_mutation_entry_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::entry_tests::native_file_disclosure_entry_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::entry_tests::postgres_native_disclosure_entry_order_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::native_file_independent_recovery_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::postgres_native_independent_recovery_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::limits_tests::native_file_recovery_limits_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::limits_tests::postgres_native_recovery_limits_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::history_tests::native_file_recovery_history_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::history_tests::postgres_native_recovery_history_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::privacy_tests::native_file_public_mutation_evidence_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::privacy_tests::postgres_native_public_mutation_evidence_fixture_is_current || failures=$((failures + 1))
          cargo test -p auths-gateway --features testkit-production-plaintext,testkit-production-unqualified --test operator_plane -- --ignored postgres || failures=$((failures + 1))
          test "$failures" -eq 0
          } 2>&1 | tee target/ap074-native-adapter-evidence.log
      - name: Verify native records external presentation corpus
        run: |
          set -o pipefail
          cargo test --locked -p auths-records-api --features testkit --lib -- --exact presentation::external_authoring_tests::native_records_presentation_authoring_fixture_is_current 2>&1 | tee target/ap073-native-records-presentation.log
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' target/ap073-native-records-presentation.log
      - name: Run complete AP074 final hardening batch
        if: ${{ !cancelled() }}
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
        run: |
          set -o pipefail
          mkdir -p target/ap074-final-hardening
          failures=0
          while IFS= read -r selector; do
            extra=()
            if [[ "$selector" == *::postgres_* ]]; then extra+=(--ignored); fi
            log="target/ap074-final-hardening/${selector//::/__}.log"
            if ! cargo test --locked -p auths-gateway --features loopback-provider,testkit-harness --lib -- "${extra[@]}" --exact "$selector" 2>&1 | tee "$log"; then
              failures=$((failures + 1))
            elif ! grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"; then
              echo "Required selector did not execute exactly once: $selector"
              failures=$((failures + 1))
            fi
          done <<'SELECTORS'
          native_cross_recipe_tests::federation_tests::native_file_coordinated_federation_fixture_is_current
          native_cross_recipe_tests::federation_tests::postgres_native_coordinated_federation_matrix
          participant_enrollment::tests::recovery_tests::native_instance_recovery_fixture_is_current
          observed_tests::effect_native_tests::engagement_tests::instance_recovery_tests::native_instance_recovery_store_fixture_is_current
          observed_tests::effect_native_tests::engagement_tests::instance_recovery_tests::postgres_native_instance_recovery_store_matrix
          native_cross_recipe_tests::native_file_cross_recipe_process_fixture_is_current
          native_cross_recipe_tests::postgres_native_cross_recipe_process_matrix
          observed_tests::effect_native_tests::engagement_tests::created_resource_tests::native_created_resource_recovery_fixture_is_current
          observed_tests::effect_native_tests::engagement_tests::created_resource_tests::postgres_native_created_resource_recovery_matrix
          native_mutation_crash_tests::guarded_tests::native_file_guarded_mutation_crash_fixture_is_current
          native_mutation_crash_tests::guarded_tests::postgres_native_guarded_mutation_crash_fixture_is_current
          native_mutation_crash_tests::partial_upload_tests::native_file_partial_upload_fixture_is_current
          native_mutation_crash_tests::partial_upload_tests::postgres_native_partial_upload_fixture_is_current
          native_information_replay_tests::journal_tests::native_file_information_journal_fixture_is_current
          native_information_replay_tests::journal_tests::postgres_native_information_journal_fixture_is_current
          native_mutation_replay_tests::journal_tests::native_file_mutation_journal_fixture_is_current
          native_mutation_replay_tests::journal_tests::postgres_native_mutation_journal_fixture_is_current
          observed_tests::effect_native_tests::binding_boundary_tests::native_independent_binding_substitutions_require_new_approval
          observed_tests::effect_native_tests::review_approval_tests::native_review_changes_require_fresh_authority_and_approval
          store::operation_revision_limit_preserves_last_event_without_wrap_or_restart
          SELECTORS
          test "$failures" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-final-hardening-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ap074-final-hardening/
          if-no-files-found: error
          retention-days: 30
      - name: Measure native managed paths and bounded recovery inventory
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
          AUTHS_AP074_COST_DIRECTORY: ${{ github.workspace }}/target/ap074-native-cost
          AUTHS_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::cost_tests::native_file_cost_measurements
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::cost_tests::postgres_native_cost_measurements
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-native-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ap074-native-cost/
          if-no-files-found: error
          retention-days: 30
      - name: Execute generated concurrent native histories on both durable adapters
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
          AUTHS_AP074_HISTORY_DIRECTORY: ${{ github.workspace }}/target/ap074-generated-histories
          AUTHS_EVIDENCE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::generated_history_tests::native_file_generated_concurrent_histories
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::generated_history_tests::postgres_native_generated_concurrent_histories
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-generated-histories-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ap074-generated-histories/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install this checkout's native Python SDK for the unchanged reference digest
        run: |
          python -m venv .ap074-reference-venv
          .ap074-reference-venv/bin/python -m pip install maturin==1.9.6
          VIRTUAL_ENV="$PWD/.ap074-reference-venv" .ap074-reference-venv/bin/maturin develop --locked --manifest-path bindings/python/Cargo.toml
      - name: Compare independent application state with freshly executed native adapter histories
        run: >-
          .ap074-reference-venv/bin/python qualification/reference/ap074_information_differential.py
          --native-log target/ap074-native-adapter-evidence.log
          --output target/ap074-independent-information-differential.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-information-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ap074-native-adapter-evidence.log
            target/ap074-independent-information-differential.json
          if-no-files-found: error
          retention-days: 30
      - name: Rehearse a physical backup and point-in-time restore
        run: deployment/gateway/tools/exercise-postgres-restore.sh
      - name: Stop fixture
        if: always()
        run: docker compose -f product/stores/auths-stores/tests/postgres_tls/compose.yaml down -v

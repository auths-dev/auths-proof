name: PostgreSQL lifecycle qualification

on:
  pull_request:
    paths:
      - "product/runtime/auths-lifecycle/**"
      - "product/runtime/auths-gateway/**"
      - "product/stores/auths-stores/**"
      - "bindings/fixtures/gateway/**"
      - "qualification/reference/ap074_information_differential.py"
      - "qualification/reference/common.py"
      - "qualification/reference/tests/test_ap074_information_differential.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/admission.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/authority.py"
      - "demos/google-employee-delegation/broker/src/employee_read_demo/contracts.py"
      - "bindings/python/**"
      - ".github/workflows/postgres-lifecycle.yml"
      - "deployment/gateway/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-multi-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - name: Start TLS PostgreSQL
        run: docker compose -f product/stores/auths-stores/tests/postgres_tls/compose.yaml up -d --wait
      - name: Run multi-host lifecycle evidence
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
        run: cargo test -p auths-stores --test postgres_lifecycle -- --ignored
      - name: Run gateway attempt-store conformance and hostile suites
        env:
          AUTHS_POSTGRES_URL: host=localhost port=55438 dbname=auths_lifecycle user=auths password=local-fixture-password sslmode=require
          AUTHS_POSTGRES_CA_PEM: ${{ github.workspace }}/product/stores/auths-stores/tests/postgres_tls/generated/ca.crt
          AUTHS_POSTGRES_SERVER_NAME: localhost
        run: |
          set -o pipefail
          mkdir -p target
          {
          cargo test -p auths-gateway --lib -- --ignored postgres
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --test content_journey -- --exact native_content_process_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_process_tests::native_file_process_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_process_tests::postgres_native_process_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_crash_tests::native_file_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_crash_tests::postgres_native_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_crash_tests::native_file_mutation_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::postgres_native_mutation_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_disclosure_crash_tests::native_file_disclosure_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::postgres_native_disclosure_process_crash_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_dependency_tests::native_file_dependency_order_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_dependency_tests::postgres_native_dependency_order_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_budget_tests::native_file_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_budget_tests::postgres_native_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_crash_tests::window_capacity_tests::native_file_mutation_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_crash_tests::window_capacity_tests::postgres_native_mutation_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_disclosure_crash_tests::window_capacity_tests::native_file_disclosure_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_disclosure_crash_tests::window_capacity_tests::postgres_native_disclosure_window_capacity_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_file_fault_tests::native_file_io_fault_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_postgres_fault_tests::postgres_native_partial_batch_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_postgres_commit_tests::postgres_native_commit_reply_loss_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_replay_tests::native_file_mutation_retained_replay_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_replay_tests::postgres_native_mutation_retained_replay_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::native_file_information_retained_replay_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::postgres_native_information_retained_replay_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::retention_tests::native_file_retention_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::retention_tests::postgres_native_retention_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::epoch_tests::native_file_epoch_fence_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::epoch_tests::postgres_native_epoch_fence_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_information_replay_tests::scope_tests::native_file_managed_scope_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_information_replay_tests::scope_tests::postgres_native_managed_scope_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_mutation_replay_tests::entry_tests::native_file_mutation_entry_order_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_mutation_replay_tests::entry_tests::postgres_native_mutation_entry_order_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --exact native_recovery_actor_tests::native_file_independent_recovery_fixture_is_current
          cargo test -p auths-gateway --features loopback-provider,testkit-harness --lib -- --ignored --exact native_recovery_actor_tests::postgres_native_independent_recovery_fixture_is_current
          cargo test -p auths-gateway --features testkit-production-plaintext,testkit-production-unqualified --test operator_plane -- --ignored postgres
          } 2>&1 | tee target/ap074-native-adapter-evidence.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install this checkout's native Python SDK for the unchanged reference digest
        run: |
          python -m venv .ap074-reference-venv
          .ap074-reference-venv/bin/python -m pip install maturin==1.9.6
          VIRTUAL_ENV="$PWD/.ap074-reference-venv" .ap074-reference-venv/bin/maturin develop --locked --manifest-path bindings/python/Cargo.toml
      - name: Compare independent application state with freshly executed native adapter histories
        run: >-
          .ap074-reference-venv/bin/python qualification/reference/ap074_information_differential.py
          --native-log target/ap074-native-adapter-evidence.log
          --output target/ap074-independent-information-differential.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ap074-information-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ap074-native-adapter-evidence.log
            target/ap074-independent-information-differential.json
          if-no-files-found: error
          retention-days: 30
      - name: Rehearse a physical backup and point-in-time restore
        run: deployment/gateway/tools/exercise-postgres-restore.sh
      - name: Stop fixture
        if: always()
        run: docker compose -f product/stores/auths-stores/tests/postgres_tls/compose.yaml down -v

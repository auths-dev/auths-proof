name: Git signing protocol

# Exercises the signing-program protocol against the Git shipped on hosted
# Linux and macOS runners.
on:
  pull_request:
    paths:
      - .github/workflows/git-signing.yml
      - product/integrations/auths-git-signing/**
  push:
    branches: [main]
    paths:
      - .github/workflows/git-signing.yml
      - product/integrations/auths-git-signing/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-protocol:
    name: git protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - run: git --version
      - run: cargo test --locked -p auths-git-signing

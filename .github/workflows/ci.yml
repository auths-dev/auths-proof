name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim disk for authoritative CI
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo docker system prune --all --force
          sudo apt-get clean

          available_kib="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          minimum_kib="$((30 * 1024 * 1024))"
          df -h /
          if (( available_kib < minimum_kib )); then
            echo "::error::Authoritative CI requires at least 30 GiB free before toolchain installation; runner has $((available_kib / 1024 / 1024)) GiB"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.0
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - name: Report authoritative toolchain
        run: |
          rustc --version
          cargo --version
          go version
          sccache --version
      - name: Verify workspace build capacity
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          minimum_kib="$((20 * 1024 * 1024))"
          df -h /
          if (( available_kib < minimum_kib )); then
            echo "::error::Authoritative CI requires at least 20 GiB free after toolchain installation; runner has $((available_kib / 1024 / 1024)) GiB"
            exit 1
          fi
      - name: Run authoritative repository CI
        shell: bash
        run: |
          set -euo pipefail
          trap 'df -h /; du -sh target 2>/dev/null || true' EXIT
          cargo xtask ci authoritative

  formal-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim disk for the pinned formal toolchain
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo docker system prune --all --force
          sudo apt-get clean

          available_kib="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          minimum_kib="$((25 * 1024 * 1024))"
          df -h /
          if (( available_kib < minimum_kib )); then
            echo "::error::Formal translation requires at least 25 GiB free; runner has $((available_kib / 1024 / 1024)) GiB"
            exit 1
          fi
      - name: Install pinned Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - name: Build pinned Aeneas and Charon
        run: >-
          nix build
          --print-build-logs
          --max-jobs 2
          --cores 2
          github:AeneasVerif/aeneas/3a8586facab25b31bdb1e1f5f45acd60d1cc5ff0#aeneas
          --out-link target/formal-tools
      - name: Report remaining runner capacity
        run: df -h / /nix/store
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          check-reservoir-eligibility: false
          leanchecker: false
          nanoda: false
          lake-package-directory: formal
      - name: Install pinned Kani
        run: |
          cargo install kani-verifier --version 0.67.0 --locked
          cargo kani setup
          kani --version
      - name: Reproduce exact production translation twice
        env:
          AUTHS_AENEAS_BIN: ${{ github.workspace }}/target/formal-tools/bin/aeneas
          AUTHS_CHARON_BIN: ${{ github.workspace }}/target/formal-tools/bin/charon
        run: cargo xtask ci formal-translation
      - name: Preserve translation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install locked compliance tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.118 --locked
          cargo install wasm-pack --version 0.15.0 --locked
          python -m pip install maturin==1.9.6
          npm ci --prefix bindings/typescript
      - run: cargo xtask ci compliance
      - name: Preserve compliance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-product-core-compliance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/compliance/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: gitleaks git --redact --no-banner

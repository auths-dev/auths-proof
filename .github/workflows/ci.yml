          REQUIRED: ${{ needs.ci-plan.outputs.formal_translation_required }}
          REASON: ${{ needs.ci-plan.outputs.formal_translation_reason }}
          RUN_RESULT: ${{ needs.formal-translation-run.result }}
          UPDATE_REQUIRED: ${{ needs.formal-translation-run.outputs.update_required }}
        run: |
          echo "Decision: ${REQUIRED}; implementation: ${RUN_RESULT}; generated update: ${UPDATE_REQUIRED}; ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLANNER" == success ]]
          [[ "$REQUIRED" == true && "$RUN_RESULT" == success && "$UPDATE_REQUIRED" != true ]] || [[ "$REQUIRED" == false && "$RUN_RESULT" == skipped ]]


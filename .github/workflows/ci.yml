name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci-plan:
    name: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authoritative_required: ${{ steps.plan.outputs.authoritative_required }}
      authoritative_reason: ${{ steps.plan.outputs.authoritative_reason }}
      formal_translation_required: ${{ steps.plan.outputs.formal_translation_required }}
      formal_translation_reason: ${{ steps.plan.outputs.formal_translation_reason }}
      formal_proof_required: ${{ steps.plan.outputs.formal_proof_required }}
      formal_proof_reason: ${{ steps.plan.outputs.formal_proof_reason }}
      formal_kani_required: ${{ steps.plan.outputs.formal_kani_required }}
      formal_kani_reason: ${{ steps.plan.outputs.formal_kani_reason }}
      formal_cold_required: ${{ steps.plan.outputs.formal_cold_required }}
      formal_cold_reason: ${{ steps.plan.outputs.formal_cold_reason }}
      formal_plan_path: ${{ steps.plan.outputs.formal_plan_path }}
      formal_proof_digest: ${{ steps.plan.outputs.formal_proof_digest }}
      formal_translation_digest: ${{ steps.plan.outputs.formal_translation_digest }}
      formal_kani_digest: ${{ steps.plan.outputs.formal_kani_digest }}
      formal_toolchain_digest: ${{ steps.plan.outputs.formal_toolchain_digest }}
      formal_evidence_digest: ${{ steps.plan.outputs.formal_evidence_digest }}
      compliance_required: ${{ steps.plan.outputs.compliance_required }}
      compliance_reason: ${{ steps.plan.outputs.compliance_reason }}
      dependencies_required: ${{ steps.plan.outputs.dependencies_required }}
      dependencies_reason: ${{ steps.plan.outputs.dependencies_reason }}
      secrets_required: ${{ steps.plan.outputs.secrets_required }}
      secrets_reason: ${{ steps.plan.outputs.secrets_reason }}
      opentofu_live_required: ${{ steps.plan.outputs.opentofu_live_required }}
      opentofu_live_reason: ${{ steps.plan.outputs.opentofu_live_reason }}
      postgresql_live_required: ${{ steps.plan.outputs.postgresql_live_required }}
      postgresql_live_reason: ${{ steps.plan.outputs.postgresql_live_reason }}
      records_api_live_required: ${{ steps.plan.outputs.records_api_live_required }}
      records_api_live_reason: ${{ steps.plan.outputs.records_api_live_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - id: plan
        name: Classify the complete change
        env:
          AUTHS_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AUTHS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          cargo run --locked -p auths-ci-plan --
          plan
          --event "${{ github.event_name }}"
          --workflow ci
          --output target/ci/plan.json
      - name: Preserve the auditable plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/plan.json
          if-no-files-found: error
          retention-days: 30

  formal-update-preflight:
    name: formal-update preflight
    needs: ci-plan
    if: github.event_name == 'pull_request' && needs.ci-plan.outputs.formal_translation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      update_required: ${{ steps.formal-update.outputs.update_required || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Reproduce the lightweight formal source closure
        run: >-
          cargo run --locked -p auths-ci-plan --
          formal-source-closure update
          --output target/formal/source-closure.expected.json
      - id: formal-update
        name: Package a bounded generated update
        env:
          AUTHS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$AUTHS_BASE_SHA"
          mkdir -p target/formal
          git show "${AUTHS_BASE_SHA}:.github/ci/formal-generated-paths.json" > target/formal/trusted-generated-paths.json
          cargo run --locked -p auths-ci-plan -- formal-update-artifact create \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --base-sha "$AUTHS_BASE_SHA" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --policy target/formal/trusted-generated-paths.json
      - name: Preserve the bounded generated update
        if: steps.formal-update.outputs.update_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal-update/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  formal-update-gate:
    name: generated artifacts current
    if: ${{ !cancelled() }}
    needs: [ci-plan, formal-update-preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Stop before expensive CI when a generated update is ready
        env:
          EVENT: ${{ github.event_name }}
          PLANNER: ${{ needs.ci-plan.result }}
          FORMAL_REQUIRED: ${{ needs.ci-plan.outputs.formal_translation_required }}
          PREFLIGHT_RESULT: ${{ needs.formal-update-preflight.result }}
          UPDATE_REQUIRED: ${{ needs.formal-update-preflight.outputs.update_required }}
        run: |
          set -euo pipefail
          [[ "$PLANNER" == success ]]
          if [[ "$EVENT" != pull_request || "$FORMAL_REQUIRED" != true ]]; then
            exit 0
          fi
          [[ "$PREFLIGHT_RESULT" == success ]]
          if [[ "$UPDATE_REQUIRED" == true ]]; then
            echo "::error::A bounded generated update is ready; expensive CI is deferred until the updater commits it."
            exit 1
          fi

  repository-preflight:
    name: repository preflight
    needs: [ci-plan, formal-update-gate]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      update_required: ${{ steps.formal-update.outputs.update_required || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Fail fast on repository-wide deterministic gates
        run: cargo xtask ci preflight

  authoritative-run:
    name: authoritative implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.authoritative_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Reclaim disk for authoritative CI
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          sudo docker system prune --all --force
          sudo apt-get clean
          available_kib="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          minimum_kib="$((30 * 1024 * 1024))"
          if (( available_kib < minimum_kib )); then
            echo "::error::Authoritative CI requires 30 GiB free; found $((available_kib / 1024 / 1024)) GiB."
            exit 1
          fi
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          additional-toolchains: 1.91.0
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - name: Report authoritative toolchain
        run: |
          rustc --version
          cargo --version
          go version
          if command -v sccache >/dev/null 2>&1; then
            sccache --version
          else
            echo "sccache unavailable; compiling without the optional shared cache"
          fi
      - name: Run authoritative repository CI
        env:
          AUTHS_EVOLUTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask ci authoritative
      - name: Record authoritative telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: authoritative
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  formal-proof-fast:
    name: formal proof fast (feedback, not qualification)
    needs: [ci-plan, formal-update-gate]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.ci-plan.outputs.formal_proof_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start formal phase timing
        run: echo "AUTHS_FORMAL_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - id: lean-setup
        uses: ./.github/actions/setup-lean
      - name: Compile the highest-value proofs, then the complete Lean libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/formal/logs
          cargo xtask ci formal-proof-fast 2>&1 | tee target/formal/logs/proof-fast.log
      - name: Summarize fast feedback
        if: always()
        run: |
          {
            echo "### Formal proof fast feedback"
            echo
            echo "This is an early Lean rejection gate, not qualification evidence."
            echo "It installs neither Aeneas, Charon, nor Kani."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the complete fast Lean log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-proof-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/logs/proof-fast.log
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve warmed pinned Lean dependencies after failure
        if: always() && steps.lean-setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.elan
            formal/.lake/packages
          key: formal-lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}
      - name: Record fast proof timing
        if: always()
        uses: ./.github/actions/formal-phase-summary
        with:
          phase: proof-fast
          started-at: ${{ env.AUTHS_FORMAL_STARTED_AT }}
          execution: executed-no-qualification

  formal-translation-run:
    name: formal translation
    needs: [ci-plan, formal-update-gate, repository-preflight, formal-proof-fast]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.formal-proof-fast.result == 'success' &&
      needs.ci-plan.outputs.formal_translation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Start formal phase timing
        run: echo "AUTHS_FORMAL_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Reclaim disk for cold translation
        if: needs.ci-plan.outputs.formal_cold_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
          sudo docker system prune --all --force
          sudo apt-get clean
      - name: Install pinned Nix with the public Aeneas Cachix substitute
        if: needs.ci-plan.outputs.formal_cold_required == 'true'
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - name: Acquire pinned Aeneas and Charon
        if: needs.ci-plan.outputs.formal_cold_required == 'true'
        run: >-
          nix build
          --print-build-logs
          --max-jobs 2
          --cores 2
          github:AeneasVerif/aeneas/3a8586facab25b31bdb1e1f5f45acd60d1cc5ff0#aeneas
          --out-link target/formal-tools
      - name: Reproduce translation twice
        if: needs.ci-plan.outputs.formal_cold_required == 'true'
        env:
          AUTHS_AENEAS_BIN: ${{ github.workspace }}/target/formal-tools/bin/aeneas
          AUTHS_CHARON_BIN: ${{ github.workspace }}/target/formal-tools/bin/charon
          AUTHS_FORMAL_UPDATE_MODE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          AUTHS_FORMAL_PHASE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_translation_digest }}
          AUTHS_FORMAL_TOOLCHAIN_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_toolchain_digest }}
          AUTHS_FORMAL_EVIDENCE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
        run: cargo xtask ci formal-translation-reproduce
      - id: formal-update
        name: Package a bounded translation update
        if: github.event_name == 'pull_request' && needs.ci-plan.outputs.formal_cold_required == 'true'
        env:
          AUTHS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$AUTHS_BASE_SHA"
          mkdir -p target/formal
          git show "${AUTHS_BASE_SHA}:.github/ci/formal-generated-paths.json" > target/formal/trusted-generated-paths.json
          cargo run --locked -p auths-ci-plan -- formal-update-artifact create \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --base-sha "$AUTHS_BASE_SHA" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --policy target/formal/trusted-generated-paths.json
      - name: Preserve the bounded translation update
        if: steps.formal-update.outputs.update_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal-update/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Stop qualification until generated translation is committed
        if: steps.formal-update.outputs.update_required == 'true'
        run: |
          echo "Generated Aeneas output drifted; the bounded updater will commit the reviewed artifact set."
          exit 1
      - name: Locate protected-base translation evidence
        if: needs.ci-plan.outputs.formal_cold_required != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f head_sha="$AUTHS_BASE_SHA" -f status=success -f per_page=50 --jq '.workflow_runs | map(select(.name == "CI" and .event == "push" and .head_branch == "main")) | first | .id')"
          [[ -n "$run_id" && "$run_id" != null ]]
          artifact_name="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts | map(select(.expired == false and (.name | startswith("auths-formal-translation-")))) | first | .name')"
          [[ -n "$artifact_name" && "$artifact_name" != null ]]
          mkdir -p target/reused-formal
          gh run download "$run_id" --name "$artifact_name" --dir target/reused-formal
          mapfile -t evidence < <(find target/reused-formal -type f -name aeneas-qualification.json)
          [[ "${#evidence[@]}" == 1 ]]
          echo "AUTHS_REUSED_TRANSLATION_EVIDENCE=${evidence[0]}" >> "$GITHUB_ENV"
          echo "Translation: protected-base run ${run_id}, artifact ${artifact_name}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and bind protected-base translation evidence
        if: needs.ci-plan.outputs.formal_cold_required != 'true'
        env:
          AUTHS_FORMAL_PHASE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_translation_digest }}
          AUTHS_FORMAL_TOOLCHAIN_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_toolchain_digest }}
          AUTHS_FORMAL_EVIDENCE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
        run: cargo xtask ci formal-translation-reuse
      - name: Preserve reusable translation evidence
        if: steps.formal-update.outputs.update_required != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/aeneas-qualification.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve translation phase result
        if: steps.formal-update.outputs.update_required != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-phase-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results/translation.json
          if-no-files-found: error
          retention-days: 90
      - name: Record translation timing
        if: always()
        uses: ./.github/actions/formal-phase-summary
        with:
          phase: translation
          started-at: ${{ env.AUTHS_FORMAL_STARTED_AT }}
          execution: ${{ needs.ci-plan.outputs.formal_cold_required == 'true' && 'executed-cold' || 'reused-protected-base' }}

  formal-kani-run:
    name: formal Kani
    needs: [ci-plan, formal-update-gate, repository-preflight, formal-proof-fast]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.formal-proof-fast.result == 'success' &&
      needs.ci-plan.outputs.formal_kani_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Start formal phase timing
        run: echo "AUTHS_FORMAL_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Install pinned Kani
        run: |
          cargo install kani-verifier --version 0.67.0 --locked
          cargo kani setup
          kani --version
      - name: Run every gated Kani harness
        env:
          AUTHS_FORMAL_PHASE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_kani_digest }}
          AUTHS_FORMAL_TOOLCHAIN_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_toolchain_digest }}
          AUTHS_FORMAL_EVIDENCE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
        run: cargo xtask ci formal-kani
      - name: Preserve Kani phase result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-phase-kani-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results/kani.json
          if-no-files-found: error
          retention-days: 90
      - name: Record Kani timing
        if: always()
        uses: ./.github/actions/formal-phase-summary
        with:
          phase: kani
          started-at: ${{ env.AUTHS_FORMAL_STARTED_AT }}
          execution: executed-complete-harness-set

  formal-lean-authoritative-run:
    name: formal Lean authoritative
    needs: [ci-plan, formal-update-gate, repository-preflight, formal-proof-fast, formal-translation-run]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.formal-proof-fast.result == 'success' &&
      needs.formal-translation-run.result == 'success' &&
      needs.ci-plan.outputs.formal_proof_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Start formal phase timing
        run: echo "AUTHS_FORMAL_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - uses: ./.github/actions/setup-lean
      - name: Clean and rebuild authoritative Lean evidence
        shell: bash
        env:
          AUTHS_FORMAL_UPDATE_MODE: ${{ github.event_name == 'pull_request' }}
          AUTHS_FORMAL_PHASE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_proof_digest }}
          AUTHS_FORMAL_TOOLCHAIN_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_toolchain_digest }}
          AUTHS_FORMAL_EVIDENCE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
        run: |
          set -euo pipefail
          mkdir -p target/formal/logs
          cargo xtask ci formal-lean-authoritative 2>&1 | tee target/formal/logs/lean-authoritative.log
      - id: formal-update
        name: Package a bounded assurance-manifest update
        if: github.event_name == 'pull_request'
        env:
          AUTHS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$AUTHS_BASE_SHA"
          mkdir -p target/formal
          git show "${AUTHS_BASE_SHA}:.github/ci/formal-generated-paths.json" > target/formal/trusted-generated-paths.json
          cargo run --locked -p auths-ci-plan -- formal-update-artifact create \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --base-sha "$AUTHS_BASE_SHA" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --policy target/formal/trusted-generated-paths.json
      - name: Preserve the bounded assurance update
        if: steps.formal-update.outputs.update_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal-update/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Preserve authoritative Lean phase result
        if: steps.formal-update.outputs.update_required != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-phase-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results/lean.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve authoritative Lean diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-lean-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/formal/lean-assurance-audit.json
            target/formal/logs/lean-authoritative.log
          if-no-files-found: warn
          retention-days: 90
      - name: Record authoritative Lean timing
        if: always()
        uses: ./.github/actions/formal-phase-summary
        with:
          phase: lean-authoritative
          started-at: ${{ env.AUTHS_FORMAL_STARTED_AT }}
          execution: executed-clean-root-outputs

  formal-evidence-run:
    name: formal evidence
    needs: [ci-plan, formal-update-gate, formal-translation-run, formal-lean-authoritative-run, formal-kani-run]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.formal-translation-run.result == 'success' &&
      needs.formal-lean-authoritative-run.result == 'success' &&
      needs.formal-lean-authoritative-run.outputs.update_required != 'true' &&
      needs.formal-kani-run.result == 'success' &&
      needs.ci-plan.outputs.formal_translation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start formal phase timing
        run: echo "AUTHS_FORMAL_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: auths-formal-phase-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: auths-formal-phase-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: auths-formal-phase-kani-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results
      - name: Aggregate exact-revision formal evidence
        env:
          AUTHS_FORMAL_PHASE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
          AUTHS_FORMAL_PROOF_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_proof_digest }}
          AUTHS_FORMAL_TRANSLATION_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_translation_digest }}
          AUTHS_FORMAL_KANI_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_kani_digest }}
          AUTHS_FORMAL_TOOLCHAIN_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_toolchain_digest }}
          AUTHS_FORMAL_EVIDENCE_CLOSURE_SHA256: ${{ needs.ci-plan.outputs.formal_evidence_digest }}
        run: cargo xtask ci formal-evidence
      - name: Preserve aggregate formal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-formal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/phase-results/evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Record evidence aggregation timing
        if: always()
        uses: ./.github/actions/formal-phase-summary
        with:
          phase: evidence
          started-at: ${{ env.AUTHS_FORMAL_STARTED_AT }}
          execution: aggregated-exact-revision-results

  compliance-run:
    name: compliance implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.compliance_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install locked compliance tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.118 --locked
          cargo install wasm-pack --version 0.15.0 --locked
          python -m pip install maturin==1.9.6
          npm ci --prefix bindings/typescript
      - run: cargo xtask ci compliance
      - name: Preserve compliance evidence
        if: always() && hashFiles('target/compliance/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auths-product-core-compliance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/compliance/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Record compliance telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: compliance
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  dependencies-run:
    name: dependencies implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.dependencies_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
          compiler-cache: "false"
      - name: Install pinned cargo-deny
        run: |
          if [[ "$(cargo deny --version 2>/dev/null || true)" != "cargo-deny 0.20.2" ]]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Enforce dependency policy
        run: cargo deny check
      - name: Record dependency telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: dependencies
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  secrets-run:
    name: secrets implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.secrets_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.6
          cache: false
      - name: Install the pinned scanner when absent
        run: |
          if ! command -v gitleaks >/dev/null 2>&1 || [[ "$(gitleaks version)" != "8.28.0" ]]; then
            go install github.com/zricethezav/gitleaks/v8@v8.28.0
          fi
      - run: gitleaks git --redact --no-banner
      - name: Record secrets telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: secrets
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  opentofu-live-run:
    name: opentofu-live implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.opentofu_live_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHS_DEMO_IMAGE_TAG: ci
      AUTHS_DEMO_PREBUILT: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: demos/opentofu-plan/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact API image with shared BuildKit layers
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: .
          file: demos/opentofu-plan/Dockerfile
          build-args: OPENTOFU_SANDBOX=local
          load: true
          push: false
          tags: auths-opentofu-demo:ci
          cache-from: type=gha,scope=opentofu-live
          cache-to: type=gha,mode=max,scope=opentofu-live
      - name: Record exact image provenance
        run: |
          mkdir -p target/ci
          docker image inspect --format '{{.Id}}' auths-opentofu-demo:ci | tee target/ci/opentofu-image-digest.txt
          echo "BuildKit digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install browser test dependencies
        working-directory: demos/opentofu-plan
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static frontend contract
        working-directory: demos/opentofu-plan
        run: npm run check
      - name: Real OpenTofu fault, restart, and reconciliation contract
        working-directory: demos/opentofu-plan
        run: npm run test:live-recovery
      - name: Native denial and concurrent-claim contract
        working-directory: demos/opentofu-plan
        run: npm run test:live-contract
      - name: Browser-to-native-to-provider contract
        working-directory: demos/opentofu-plan
        run: npm run test:e2e
      - name: Preserve service logs after failure
        if: failure()
        working-directory: demos/opentofu-plan
        run: docker compose logs --no-color
      - name: Preserve exact image provenance
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opentofu-image-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/opentofu-image-digest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record OpenTofu telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: opentofu-live
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  postgresql-live-run:
    name: postgresql-live implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.postgresql_live_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      AUTHS_EXECUTOR_PASSWORD: ci-executor-${{ github.run_id }}-${{ github.run_attempt }}
      AUTHS_POSTGRESQL_FAULT: none
      AUTHS_POSTGRESQL_RECEIPT_FAULT: none
      AUTHS_DEMO_IMAGE_TAG: ci
      AUTHS_DEMO_PREBUILT: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: demos/postgresql-data-change/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact API image with shared BuildKit layers
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: .
          file: demos/postgresql-data-change/Dockerfile
          load: true
          push: false
          tags: auths-postgresql-demo:ci
          cache-from: type=gha,scope=postgresql-live
          cache-to: type=gha,mode=max,scope=postgresql-live
      - name: Record exact image provenance
        run: |
          mkdir -p target/ci
          docker image inspect --format '{{.Id}}' auths-postgresql-demo:ci | tee target/ci/postgresql-image-digest.txt
          echo "BuildKit digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the PostgreSQL TLS fixture image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: demos/postgresql-data-change
          file: demos/postgresql-data-change/database/Dockerfile.tls
          load: true
          push: false
          tags: postgresql-data-change-certificates:latest
          cache-from: type=gha,scope=postgresql-live-certificates
          cache-to: type=gha,mode=max,scope=postgresql-live-certificates
      - name: Install browser test dependencies
        working-directory: demos/postgresql-data-change
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static frontend contract
        working-directory: demos/postgresql-data-change
        run: npm run check
      - name: Real PostgreSQL rollback, restart, and reconciliation contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-recovery
# The transactional multi-process lifecycle-store contract is NOT run here.
      #
      # postgres_lifecycle's `configured()` requires AUTHS_POSTGRES_URL,
      # AUTHS_POSTGRES_CA_PEM and AUTHS_POSTGRES_SERVER_NAME -- a TLS PostgreSQL
      # with a CA certificate. This job runs the plain demo database on 54329 and
      # was setting AUTHS_LIFECYCLE_POSTGRES_URL, which `configured()` does not
      # read, so the test panicked with "TLS PostgreSQL environment slots are
      # required" on every run.
      #
      # It is owned by .github/workflows/postgres-lifecycle.yml, which stands up
      # the TLS fixture in tests/postgres_tls/compose.yaml, supplies all three
      # slots, and triggers on changes to auths-lifecycle or auths-stores.
      # Running it in two places, correctly in one, was the defect.
      - name: Privilege, RLS, injection, concurrency, timeout, and drift contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-database
      - name: Native denial and concurrent-claim contract
        working-directory: demos/postgresql-data-change
        run: npm run test:live-contract
      - name: Reset before browser contract
        working-directory: demos/postgresql-data-change
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U migration_admin -d auths_demo -f /demo/reset.sql
      - name: Browser-to-native-to-database contract
        working-directory: demos/postgresql-data-change
        run: npm run test:e2e
      - name: Preserve service logs after failure
        if: failure()
        working-directory: demos/postgresql-data-change
        run: docker compose logs --no-color
      - name: Preserve exact image provenance
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-image-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/postgresql-image-digest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record PostgreSQL telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: postgresql-live
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  records-api-live-run:
    name: records-api-live implementation
    needs: [ci-plan, formal-update-gate, repository-preflight]
    if: >-
      !cancelled() &&
      needs.ci-plan.result == 'success' &&
      needs.formal-update-gate.result == 'success' &&
      needs.repository-preflight.result == 'success' &&
      needs.ci-plan.outputs.records_api_live_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start telemetry
        run: echo "AUTHS_PHASE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Product and HTTP contracts
        run: cargo test -p auths-records-api -p auths-records-demo --lib
      - name: Real Iroh and cross-transport replay contract
        run: >-
          cargo test -p auths-records-demo
          iroh_executes_and_https_replay_cannot_duplicate_the_effect
          -- --ignored --nocapture
      - name: Frontend contract
        working-directory: demos/rest-api-authorization
        run: npm run check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact production image with shared BuildKit layers
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v6
        with:
          context: .
          file: demos/rest-api-authorization/Dockerfile
          load: true
          push: false
          tags: auths-records-demo:ci
          cache-from: type=gha,scope=records-api-live
          cache-to: type=gha,mode=max,scope=records-api-live
      - name: Exercise and record the exact production image
        env:
          AUTHS_DEMO_IMAGE_TAG: ci
        run: |
          mkdir -p target/ci
          docker image inspect --format '{{.Id}}' auths-records-demo:ci | tee target/ci/records-image-digest.txt
          docker compose -f demos/rest-api-authorization/compose.yaml up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4180/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker compose -f demos/rest-api-authorization/compose.yaml logs --no-color
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4180/healthz
          echo "BuildKit digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          docker compose -f demos/rest-api-authorization/compose.yaml down --volumes
      - name: Preserve exact image provenance
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: records-image-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/records-image-digest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record records API telemetry
        if: always()
        uses: ./.github/actions/phase-telemetry
        with:
          phase: records-api-live
          started-at: ${{ env.AUTHS_PHASE_STARTED }}

  authoritative:
    name: authoritative
    if: ${{ !cancelled() }}
    needs: [ci-plan, authoritative-run]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce planned result
        env:
          PLANNER: ${{ needs.ci-plan.result }}
          REQUIRED: ${{ needs.ci-plan.outputs.authoritative_required }}
          REASON: ${{ needs.ci-plan.outputs.authoritative_reason }}
          RUN_RESULT: ${{ needs.authoritative-run.result }}
        run: |
          echo "Decision: ${REQUIRED}; implementation: ${RUN_RESULT}; ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLANNER" == success ]]
          [[ "$REQUIRED" == true && "$RUN_RESULT" == success ]] || [[ "$REQUIRED" == false && "$RUN_RESULT" == skipped ]]

  formal-translation:
    name: formal-translation
    if: ${{ !cancelled() }}
    needs: [ci-plan, formal-evidence-run]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce planned result
        env:
          PLANNER: ${{ needs.ci-plan.result }}
          REQUIRED: ${{ needs.ci-plan.outputs.formal_translation_required }}
          REASON: ${{ needs.ci-plan.outputs.formal_translation_reason }}
          RUN_RESULT: ${{ needs.formal-evidence-run.result }}
        run: |
          echo "Decision: ${REQUIRED}; evidence: ${RUN_RESULT}; ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$PLANNER" == success ]]
          [[ "$REQUIRED" == true && "$RUN_RESULT" == success ]] || [[ "$REQUIRED" == false && "$RUN_RESULT" == skipped ]]

  compliance:
    name: compliance
    if: ${{ !cancelled() }}
    needs: [ci-plan, compliance-run]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce planned result

name: Google read demo installed images

on:
  pull_request:
    paths:
      - "demos/google-employee-delegation/**"
      - "bindings/python/**"
      - "core/crates/auths-author/**"
      - ".github/workflows/google-read-demo-images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches: [main]
    paths:
      - "demos/google-employee-delegation/**"
      - "bindings/python/**"
      - "core/crates/auths-author/**"
      - ".github/workflows/google-read-demo-images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-read-demo-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installed-images:
    name: broker and agent from installed SDK wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check browser activation request contract
        working-directory: demos/google-employee-delegation
        run: |
          node --check broker/src/employee_read_demo/web/workbench.js
          node broker/tests/workbench-browser.cjs
      - run: python -m pip install maturin==1.9.6
      - run: >-
          maturin build --profile python-extension --locked
          --manifest-path bindings/python/Cargo.toml
          --out target/google-read-artifacts
      - name: Stage and hash branch-built Linux wheel
        run: |
          set -eu
          set -- target/google-read-artifacts/auths-*.whl
          test "$#" -eq 1
          cp "$1" demos/google-employee-delegation/artifacts/
          echo "AP070_WHEEL_SHA256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run broker and agent suites against installed packages
        run: |
          python -m venv .ap070-test-venv
          .ap070-test-venv/bin/python -m pip install \
            target/google-read-artifacts/auths-*.whl \
            ./demos/google-employee-delegation/broker \
            ./demos/google-employee-delegation/agent
          .ap070-test-venv/bin/python -m unittest discover \
            -s demos/google-employee-delegation/broker/tests -q
          .ap070-test-venv/bin/python -m unittest discover \
            -s demos/google-employee-delegation/agent/tests -q
      - name: Build installed broker image
        working-directory: demos/google-employee-delegation
        run: >-
          docker build -f Dockerfile --build-arg AP070_ROLE=broker
          --build-arg AUTHS_WHEEL_SHA256="$AP070_WHEEL_SHA256"
          -t auths-google-read-broker:ci .
      - name: Build installed agent image
        working-directory: demos/google-employee-delegation
        run: >-
          docker build -f Dockerfile --build-arg AP070_ROLE=agent
          --build-arg AUTHS_WHEEL_SHA256="$AP070_WHEEL_SHA256"
          -t auths-google-read-agent:ci .
      - name: Check installed CLI entry points and runtime source isolation
        run: |
          docker run --rm --entrypoint sh auths-google-read-broker:ci -c \
            'command -v auths-google-read-workbench && test ! -e /build/broker'
          docker run --rm --entrypoint sh auths-google-read-agent:ci -c \
            'command -v auths-google-read-agent && test ! -e /build/agent'
      - name: Probe installed Compose containers and restricted routes
        env:
          AP070_BROKER_IMAGE: auths-google-read-broker:ci
          AP070_AGENT_IMAGE: auths-google-read-agent:ci
          AP070_BROKER_STATE_DIR: ${{ runner.temp }}/ap070-broker
          AP070_AGENT_DIR: ${{ runner.temp }}/ap070-agent
          AP070_MODEL_API_KEY_FILE: ${{ runner.temp }}/ap070-model-key
          AP070_MODEL_ID: ci-probe-no-model-call
        run: |
          set -euo pipefail
          export AP070_RUNTIME_UID="$(id -u)"
          export AP070_RUNTIME_GID="$(id -g)"
          mkdir -m 700 "$AP070_BROKER_STATE_DIR" "$AP070_AGENT_DIR"
          printf 'synthetic-only-ci-probe\n' > "$AP070_MODEL_API_KEY_FILE"
          chmod 600 "$AP070_MODEL_API_KEY_FILE"
          cd demos/google-employee-delegation
          trap 'docker compose -p ap070-installed-ci down --remove-orphans' EXIT
          docker compose -p ap070-installed-ci up -d broker browser-relay agent-relay model-relay
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/session > /tmp/ap070-session.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; d=json.load(open("/tmp/ap070-session.json")); assert d["contract"] == "auths.employee-session/v1"'
          docker compose -p ap070-installed-ci --profile task run --rm --no-deps -T \
            --entrypoint python agent - < isolation/probe_agent.py
      - name: Assemble source-free operator kit candidate
        run: |
          set -euo pipefail
          kit=target/google-read-operator-kit
          mkdir -p "$kit/isolation" "$kit/evidence"
          cp demos/google-employee-delegation/compose.yaml "$kit/"
          cp demos/google-employee-delegation/compose.live.yaml "$kit/"
          cp demos/google-employee-delegation/versions.lock.json "$kit/"
          cp demos/google-employee-delegation/README.md "$kit/"
          cp demos/google-employee-delegation/isolation/*.conf "$kit/isolation/"
          cp demos/google-employee-delegation/evidence/live-acceptance-template.md "$kit/evidence/"
          printf '%s\n' "$GITHUB_SHA" > "$kit/REVISION"
          (
            cd "$kit"
            sha256sum REVISION README.md compose.yaml compose.live.yaml \
              versions.lock.json isolation/*.conf evidence/live-acceptance-template.md > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test ! -e "$kit/broker" && test ! -e "$kit/agent"
          tar -C target --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -cf - google-read-operator-kit | gzip -n > target/google-read-operator-kit.tar.gz
          (
            cd target
            sha256sum google-read-operator-kit.tar.gz > google-read-operator-kit.tar.gz.sha256
            sha256sum -c google-read-operator-kit.tar.gz.sha256
          )
          (
            cd target/google-read-artifacts
            sha256sum auths-*.whl > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload reviewed operator kit candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: google-read-operator-kit-${{ github.sha }}
          path: |
            target/google-read-operator-kit.tar.gz
            target/google-read-operator-kit.tar.gz.sha256
          if-no-files-found: error
      - name: Upload exact branch-built Linux SDK wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: google-read-linux-wheel-${{ github.sha }}
          path: |
            target/google-read-artifacts/auths-*.whl
            target/google-read-artifacts/SHA256SUMS
          if-no-files-found: error

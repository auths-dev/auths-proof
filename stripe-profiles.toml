[boundary]
generic_policy_language_forbidden = true
runtime_operation_dispatch_forbidden = true
union_action_forbidden = true
generic_provider_gateway_forbidden = true
generic_credential_scope_forbidden = true
authorization_is_not_execution = true
provider_success_requires_observation = true
unknown_outcomes_hold_capacity = true
profile_receipts_required = true
profile_fixtures_required = true
profile_live_demos_required = true

shared_mechanisms = [
  "canonical-leaf-types",
  "checked-minor-unit-arithmetic",
  "immutable-policy-and-evaluator-commitments",
  "durable-storage-mechanics",
  "replay-and-idempotency-identifiers",
  "receipt-envelope-fields",
  "secret-redaction",
  "frontend-layout-and-browser-test-infrastructure",
]

profile_owned_surfaces = [
  "exact-action",
  "typed-evaluator-entrypoint",
  "verified-command",
  "lifecycle-transition",
  "provider-gateway",
  "credential-scope",
  "execution-service",
  "reconciliation",
  "receipt-and-stable-codes",
  "fixtures-and-mutation-corpus",
  "live-demo-contract",
]


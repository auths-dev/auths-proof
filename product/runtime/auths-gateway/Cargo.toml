[package]
name = "auths-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Closed developer-authored request recipes for the Auths gateway"
publish = false

[features]
# Development and CI only: lets `serve --loopback-provider <port>` send
# provider requests to a plain-HTTP provider double on 127.0.0.1.
loopback-provider = []
testkit-harness = []
# Tests only: lets a production installation keep its provider secret in the
# local file, for tests of the production store and operator plane that have
# no secret manager. The default build lacks it, so a shipped gateway always
# refuses the local file under production policy.
testkit-production-plaintext = []
# Tests only: lets a production installation run without a qualification,
# for tests of the production store and operator plane that predate any
# pinned qualification trust root. The default build lacks it, so a shipped
# gateway always requires qualification under production policy.
testkit-production-unqualified = []
# Fuzzing only: exposes `auths_gateway::fuzzing`, thin wrappers over
# crate-private parsers and rules for `auths-gateway-fuzz`.
fuzzing = []

[[bin]]
name = "auths-gateway"
path = "src/bin/auths-gateway.rs"

[[bin]]
name = "auths-gateway-harness"
path = "src/bin/auths-gateway-harness.rs"
required-features = ["testkit-harness"]

[dependencies]
auths-approval-quorum.workspace = true
auths-author.workspace = true
auths-bounded-policy.workspace = true
auths-connections.workspace = true
auths-credentials-aws-secrets-manager.workspace = true
auths-codec.workspace = true
auths-did-keri.workspace = true
auths-custody.workspace = true
auths-did-key.workspace = true
auths-gateway-kernel.workspace = true
auths-lifecycle.workspace = true
auths-model.workspace = true
auths-multikey.workspace = true
auths-ports.workspace = true
auths-profile-api.workspace = true
auths-profile-mcp.workspace = true
auths-raw-key.workspace = true
auths-raw-key-core.workspace = true
auths-recipe-qualification.workspace = true
auths-registries.workspace = true
auths-signature.workspace = true
auths-stores.workspace = true
auths-verifier.workspace = true
base64ct.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
minicbor.workspace = true
getrandom.workspace = true
rustix.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
async-trait.workspace = true
auths-recipe-qualification-issuance = { workspace = true, features = ["testkit"] }
auths-author.workspace = true
auths-sdk.workspace = true
auths-custody = { workspace = true, features = ["conformance"] }
auths-custody-aws-kms.workspace = true
auths-custody-pkcs11.workspace = true
p256.workspace = true
postgres.workspace = true
proptest.workspace = true
rustls.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
tokio-postgres-rustls.workspace = true

[lints]
workspace = true

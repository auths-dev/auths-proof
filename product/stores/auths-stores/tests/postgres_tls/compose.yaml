name: auths-lifecycle-postgres

services:
  certificates:
    image: postgres:17.10-bookworm
    user: root
    entrypoint: ["/bin/bash", "/fixture/generate-certificates.sh"]
    volumes:
      - .:/fixture

  postgres:
    image: postgres:17.10-bookworm
    depends_on:
      certificates:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: auths_lifecycle
      POSTGRES_PASSWORD: local-fixture-password
      POSTGRES_USER: auths
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/fixture/generated/server.crt
      - -c
      - ssl_key_file=/fixture/generated/server.key
      - -c
      - ssl_ca_file=/fixture/generated/ca.crt
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auths -d auths_lifecycle"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "55438:5432"
    volumes:
      - .:/fixture:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

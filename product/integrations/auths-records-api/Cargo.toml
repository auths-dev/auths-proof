[package]
name = "auths-records-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Transport-neutral, bounded Auths authorization for a typed records API"
repository.workspace = true
homepage.workspace = true

[features]
# Fixed/public and external-signature authoring for reference demos/conformance.
# Default production builds contain neither fixture issuance nor demo keys.
testkit = ["dep:auths-author", "dep:auths-codec", "dep:auths-ports", "dep:auths-raw-key", "dep:auths-registries", "dep:auths-runtime", "dep:auths-signature", "dep:auths-stores"]

[dependencies]
auths-author = { workspace = true, optional = true }
auths-codec = { workspace = true, optional = true }
auths-ports = { workspace = true, optional = true }
auths-raw-key = { workspace = true, optional = true }
auths-registries = { workspace = true, optional = true }
auths-runtime = { workspace = true, optional = true }
auths-signature = { workspace = true, optional = true }
auths-stores = { workspace = true, optional = true }
auths-bounded-policy.workspace = true
auths-lifecycle.workspace = true
auths-model.workspace = true
auths-profile-api.workspace = true
auths-sdk.workspace = true
auths-signature-core.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
auths-stores.workspace = true
proptest.workspace = true

[lints]
workspace = true

evidence = [
  "multi-host-store",
  "runtime-recovery",
  "custody-conformance",
  "operations-privacy",
  "exact-effect-profiles",
  "sdk-differential",
  "reference-deployment",
  "sustained-qualification",
  "independent-review",
]

exclusions = [
  "hosted-control-plane",
  "generic-executor",
  "arbitrary-provider-request",
  "regulatory-compliance",
  "universal-exactly-once",
]

[release]
candidate = "open-production-candidate-1"
version = "1.0.0-rc.1"
source_commit_slot = "AUTHS_CANDIDATE_COMMIT"

[topology]
class = "customer-operated"
runtime_instances = 3

[lifecycle_store]
family = "postgresql-v1"
tls = "required"
schema = "auths.lifecycle.postgresql/3"
secret_slot = "AUTHS_POSTGRES_URL"

[[custody]]
family = "aws-kms-p256-v1"
secret_slot = "AUTHS_KMS_KEY_ARN"

[[custody]]
family = "pkcs11-p256-v1"
secret_slot = "AUTHS_PKCS11_KEY_LABEL"

[[profiles]]
id = "opentofu-saved-plan-apply-v1"
package = "product/integrations/auths-opentofu"
provider_contract = "auths.opentofu.closed-provider/1"
receipt_schema = "auths.opentofu.decision-receipt/1"
fixture_suite = "product/fixtures/v1/opentofu"

[[profiles]]
id = "postgresql-bounded-update-v1"
package = "product/integrations/auths-postgresql"
provider_contract = "auths.postgresql.closed-provider/1"
receipt_schema = "auths.postgresql.decision-receipt/1"
fixture_suite = "product/fixtures/v1/postgresql"

[[profiles]]
id = "github-issue-address-v1"
package = "product/integrations/auths-github"
provider_contract = "auths.github.closed-provider/1"
receipt_schema = "auths.github.decision-receipt/1"
fixture_suite = "product/fixtures/v1/github"

[sdks]

[[sdks.artifacts]]
language = "rust"
package = "auths-sdk"
version = "1.0.0-rc.1"
abi = "release/semantic-freeze.json"
public_api_snapshot = "release/semantic-freeze.json"

[[sdks.artifacts]]
language = "typescript"
package = "@auths-dev/sdk"
version = "1.0.0-rc.1"
abi = "bindings/wasm/auths-proof-wasm/authoring-abi-v1.json"
public_api_snapshot = "bindings/typescript/api/public-api.txt"

[[sdks.artifacts]]
language = "python"
package = "auths"
version = "1.0.0-rc.1"
abi = "bindings/python/native-abi-v2.json"
public_api_snapshot = "bindings/python/api/public-api.txt"

[operations]
availability_basis_points = 9990
decision_p95_milliseconds = 250
recovery_p95_seconds = 300
maximum_concurrent_workflows = 10000

schema = "auths.release-subjects/1"
manifest_schema = "auths.release-manifest/1"
product = "Auths"
repository = "auths-dev/auths-proof"
first_rc_tag = "auths-v1.0.0-rc.1"
policy = "Every first-RC subject requires SLSA 1.2 Build Level 3 provenance. Preparation is not publication authorization."
production_candidate_manifest = "release/open-production-candidate.json"
production_candidate_schema = "product/spec/v1/open-production-candidate.schema.json"
assurance_manifest = "release/assurance/open-production-candidate-1/manifest.json"
assurance_candidate_schema = "product/spec/v1/assurance-candidate.schema.json"
assurance_manifest_schema = "product/spec/v1/assurance-manifest.schema.json"
assurance_record_schema = "product/spec/v1/assurance-record.schema.json"
assurance_signers = "release/assurance/trusted-signers.json"
assurance_signers_schema = "product/spec/v1/assurance-signers.schema.json"

[[families]]
id = "source-archive"
coordinate = "auths-<version>-source.tar.zst"
media_type = "application/zstd"
reproducibility = "byte-identical"
producer = "AP32-PR4"
publication = "GitHub prerelease only after exact-manifest authorization"

[[families]]
id = "rust-crates"
coordinate = "target/package/<crate>-<version>.crate"
media_type = "application/vnd.rust.crate"
reproducibility = "byte-identical"
producer = "cargo package --locked"
publication = "crates.io only after exact-manifest authorization"

[[families]]
id = "typescript-sdk"
coordinate = "@auths-dev/sdk"
media_type = "application/gzip"
reproducibility = "byte-identical"
producer = "npm pack"
publication = "npm only after exact-manifest authorization"

[[families]]
id = "python-sdk"
coordinate = "auths"
media_type = "application/vnd.python.wheel"
reproducibility = "platform-reproducible"
producer = "maturin build"
publication = "PyPI only after exact-manifest authorization"

[[families]]
id = "wasm-module"
coordinate = "@auths-dev/sdk/wasm/auths_proof_wasm_bg.wasm"
media_type = "application/wasm"
reproducibility = "platform-reproducible"
producer = "wasm-pack build with the frozen Rust and wasm-bindgen toolchains"
publication = "Contained by the npm subject; not separately published"
binding = "The JavaScript wrapper, these WASM bytes, and the packaged loader form one subject. The published SDK resolves this exact vendored subject and accepts no caller-selected module, WASM input, or engine on the capability-minting path, so provenance over the npm subject covers verification behavior."

[[families]]
id = "assurance-bundle"
coordinate = "auths-<version>-assurance.tar.zst"
media_type = "application/zstd"
reproducibility = "byte-identical"
producer = "AP32-PR4 before detached signed provenance; provenance is stored beside the archive to avoid a self-referential digest"
publication = "GitHub prerelease only after exact-manifest authorization"

[[excluded]]
id = "domain-integrations"
reason = "Domain packages, demos, benchmarks, testkits, fuzz crates, internal tools, CLIs, hosted services, and OCI images are outside the lean first-RC catalogue."

[[excluded]]
id = "proof-build-crates"
reason = "auths-proof-wasm and auths-proof-python are private build boundaries owned by the npm and PyPI subjects, not additional public package roots."

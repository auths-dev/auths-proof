[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "auths-sqlite"
version = "1.0.0rc1"
description = "SQLite runtime-store adapter for Auths Python"
requires-python = ">=3.9"
dependencies = ["auths==1.0.0rc1"]
license = "MIT OR Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["python/auths_sqlite"]

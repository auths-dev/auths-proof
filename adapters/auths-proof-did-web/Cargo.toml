[features]
default = ["std"]
std = [
    "auths-proof-model/std",
    "auths-proof-codec/std",
    "auths-proof-adapter-api/std",
    "auths-proof-multikey/std",
    "serde_json/std",
    "sha2/std",
]
test-signing = []

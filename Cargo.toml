[workspace]
resolver = "2"
members = [
    "examples/offline-verification",
    "bindings/auths-proof-wasm",
    "core/crates/auths-proof",
    "core/crates/auths-model",
    "core/crates/auths-codec",
    "core/crates/auths-ports",
    "core/crates/auths-registries",
    "core/crates/auths-signature",
    "core/crates/auths-authority",
    "core/crates/auths-composition",
    "core/crates/auths-assurance",
    "core/crates/auths-verifier",
    "core/crates/auths-author",
    "core/crates/auths-multikey",
    "core/testkit/auths-testkit",
    "core/adapters/auths-raw-key",
    "core/adapters/auths-did-key",
    "core/adapters/auths-did-keri",
    "core/adapters/auths-did-web",
    "core/adapters/auths-webauthn",
    "core/adapters/auths-hsm-attested",
    "core/adapters/auths-spiffe-x509",
    "exchange/crates/auths-proof-exchange",
    "exchange/crates/auths-proof-exchange-model",
    "exchange/crates/auths-proof-exchange-codec",
    "exchange/crates/auths-proof-exchange-port",
    "exchange/crates/auths-proof-exchange-framing",
    "exchange/adapters/auths-proof-exchange-memory",
    "exchange/adapters/auths-proof-exchange-iroh",
    "exchange/adapters/auths-proof-exchange-tcp",
    "exchange/adapters/auths-proof-exchange-unix",
    "exchange/adapters/auths-proof-exchange-file",
    "exchange/adapters/auths-proof-exchange-https",
    "exchange/testkit/auths-proof-exchange-testkit",
    "xtask",
]
exclude = ["core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/auths-dev/auths-proof"
homepage = "https://github.com/auths-dev/auths-proof"

[workspace.dependencies]
auths-model = { version = "0.1.0", path = "core/crates/auths-model", default-features = false }
auths-codec = { version = "0.1.0", path = "core/crates/auths-codec", default-features = false }
auths-ports = { version = "0.1.0", path = "core/crates/auths-ports", default-features = false }
auths-registries = { version = "0.1.0", path = "core/crates/auths-registries", default-features = false }
auths-signature = { version = "0.1.0", path = "core/crates/auths-signature", default-features = false }
auths-authority = { version = "0.1.0", path = "core/crates/auths-authority", default-features = false }
auths-composition = { version = "0.1.0", path = "core/crates/auths-composition", default-features = false }
auths-assurance = { version = "0.1.0", path = "core/crates/auths-assurance", default-features = false }
auths-verifier = { version = "0.1.0", path = "core/crates/auths-verifier", default-features = false }
auths-author = { version = "0.1.0", path = "core/crates/auths-author", default-features = false }
auths-multikey = { version = "0.1.0", path = "core/crates/auths-multikey", default-features = false }
auths-testkit = { version = "0.1.0", path = "core/testkit/auths-testkit" }
auths-proof = { version = "0.1.0", path = "core/crates/auths-proof", default-features = false }
auths-raw-key = { version = "0.1.0", path = "core/adapters/auths-raw-key", default-features = false }
auths-did-key = { version = "0.1.0", path = "core/adapters/auths-did-key", default-features = false }
auths-did-keri = { version = "0.1.0", path = "core/adapters/auths-did-keri", default-features = false }
auths-did-web = { version = "0.1.0", path = "core/adapters/auths-did-web", default-features = false }
auths-webauthn = { version = "0.1.0", path = "core/adapters/auths-webauthn", default-features = false }
auths-hsm-attested = { version = "0.1.0", path = "core/adapters/auths-hsm-attested", default-features = false }
auths-spiffe-x509 = { version = "0.1.0", path = "core/adapters/auths-spiffe-x509", default-features = false }
auths-proof-exchange = { version = "0.1.0", path = "exchange/crates/auths-proof-exchange" }
auths-proof-exchange-model = { version = "0.1.0", path = "exchange/crates/auths-proof-exchange-model" }
auths-proof-exchange-codec = { version = "0.1.0", path = "exchange/crates/auths-proof-exchange-codec" }
auths-proof-exchange-port = { version = "0.1.0", path = "exchange/crates/auths-proof-exchange-port" }
auths-proof-exchange-framing = { version = "0.1.0", path = "exchange/crates/auths-proof-exchange-framing" }
auths-proof-exchange-memory = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-memory" }
auths-proof-exchange-iroh = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-iroh" }
auths-proof-exchange-tcp = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-tcp" }
auths-proof-exchange-unix = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-unix" }
auths-proof-exchange-file = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-file" }
auths-proof-exchange-https = { version = "0.1.0", path = "exchange/adapters/auths-proof-exchange-https" }
auths-proof-exchange-testkit = { version = "0.1.0", path = "exchange/testkit/auths-proof-exchange-testkit" }
async-trait = "0.1.91"
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.4", default-features = false, features = ["pure"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5.60", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
hex = "0.4.3"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
proptest = "1.9.0"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc", "preserve_order"] }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6.1", default-features = false }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1.15.1", default-features = false, features = ["alloc"] }
rustls-webpki = { version = "0.103.13", default-features = false, features = ["alloc", "ring"] }
ring = { version = "0.17.14", default-features = false }
x509-parser = { version = "0.18.1", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
wasm-bindgen = "=0.2.118"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

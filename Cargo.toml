[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The CPython extension module. `panic = "abort"` is correct for the standalone
# binaries and wrong for an extension: a panic there aborts the host
# interpreter instead of raising (measured: exit status 134), so pyo3's
# catch_unwind never runs. `bindings/python/build.rs` refuses to compile the
# extension under an aborting strategy.
[profile.python-extension]
inherits = "release"
panic = "unwind"
# The extension is loaded into a long-lived host process, so retain Rust's
# internal invariant checks even in optimized wheels. This also avoids an
# Xcode 27 arm64 linker layout that emits a four-byte-aligned LINKEDIT string
# table which the macOS loader correctly rejects.
debug-assertions = true

[workspace]
resolver = "2"
members = [
    "crates/auths-proof-model",
    "crates/auths-proof-codec",
    "crates/auths-proof-adapter-api",
    "crates/auths-proof-verifier",
    "crates/auths-proof-author",
    "crates/auths-proof-testkit",
    "crates/auths-proof-multikey",
    "adapters/auths-proof-raw-key",
    "adapters/auths-proof-did-key",
    "adapters/auths-proof-did-keri",
    "adapters/auths-proof-did-web",
    "resolvers/auths-proof-did-web-http",
    "apps/auths-proof-cli",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
auths-proof-model = { version = "0.1.0", path = "crates/auths-proof-model", default-features = false }
auths-proof-codec = { version = "0.1.0", path = "crates/auths-proof-codec", default-features = false }
auths-proof-adapter-api = { version = "0.1.0", path = "crates/auths-proof-adapter-api", default-features = false }
auths-proof-verifier = { version = "0.1.0", path = "crates/auths-proof-verifier", default-features = false }
auths-proof-author = { version = "0.1.0", path = "crates/auths-proof-author", default-features = false }
auths-proof-multikey = { version = "0.1.0", path = "crates/auths-proof-multikey", default-features = false }
auths-proof-raw-key = { version = "0.1.0", path = "adapters/auths-proof-raw-key", default-features = false }
auths-proof-did-key = { version = "0.1.0", path = "adapters/auths-proof-did-key", default-features = false }
auths-proof-did-keri = { version = "0.1.0", path = "adapters/auths-proof-did-keri", default-features = false }
auths-proof-did-web = { version = "0.1.0", path = "adapters/auths-proof-did-web", default-features = false }
auths-proof-did-web-http = { version = "0.1.0", path = "resolvers/auths-proof-did-web-http" }
auths-proof-testkit = { version = "0.1.0", path = "crates/auths-proof-testkit" }

base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.4", default-features = false, features = ["pure"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5.60", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
hex = "0.4.3"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
proptest = "1.9.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc", "preserve_order"] }
sha2 = { version = "0.10.9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

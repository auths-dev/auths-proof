[package]
name = "auths-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
auths-author = { workspace = true, features = ["std"] }
auths-codec = { workspace = true, features = ["std"] }
auths-did-key = { workspace = true, features = ["std"] }
auths-did-keri = { workspace = true, features = ["std", "test-signing"] }
auths-did-web = { workspace = true, features = ["std"] }
auths-hsm-attested = { workspace = true, features = ["std"] }
auths-model = { workspace = true, features = ["std"] }
auths-multikey = { workspace = true, features = ["std"] }
auths-raw-key = { workspace = true, features = ["std"] }
auths-signature = { workspace = true, features = ["std"] }
auths-spiffe-x509 = { workspace = true, features = ["std"] }
auths-webauthn = { workspace = true, features = ["std"] }
base64ct = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["std", "pkcs8"] }
p256 = { workspace = true, features = ["std"] }
rcgen = "0.14.8"
rustls-pki-types = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }

[lints]
workspace = true

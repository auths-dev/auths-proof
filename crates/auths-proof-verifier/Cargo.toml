[package]
name = "auths-proof-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
auths-proof-model.workspace = true
auths-proof-codec.workspace = true
auths-proof-adapter-api.workspace = true

[dev-dependencies]
auths-proof-author = { workspace = true, features = ["std"] }
auths-proof-raw-key = { workspace = true, features = ["std", "test-signing"] }
proptest.workspace = true

[features]
default = ["std"]
std = [
    "auths-proof-model/std",
    "auths-proof-codec/std",
    "auths-proof-adapter-api/std",
]

[package]
name = "auths-path-webpki"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure rustls-webpki certificate-path verifier for Auths"

[features]
default = ["std"]
std = [
    "auths-model/std",
    "auths-ports/std",
    "rustls-pki-types/std",
    "rustls-webpki/std",
]

[dependencies]
auths-model.workspace = true
auths-ports.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
x509-parser.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
rcgen = "=0.13.2"

[lints]
workspace = true

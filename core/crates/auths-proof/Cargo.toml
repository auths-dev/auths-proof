[package]
name = "auths-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Supported facade for embedded Auths Proof Protocol V1 verification"

[features]
default = ["std"]
std = [
    "auths-codec/std",
    "auths-model/std",
    "auths-registries/std",
    "auths-verifier/std",
]

[dependencies]
auths-codec.workspace = true
auths-model.workspace = true
auths-registries.workspace = true
auths-verifier.workspace = true

[dev-dependencies]
auths-ports = { workspace = true, features = ["std"] }
auths-raw-key = { workspace = true, features = ["std"] }
auths-signature = { workspace = true, features = ["std"] }
auths-testkit = { path = "../../testkit/auths-testkit" }

[lints]
workspace = true

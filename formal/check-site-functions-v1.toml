# Each kernel check site (core/testkit/auths-testkit/src/check_sites.rs,
# CHECK_SITES) mapped to the functions that decide it, by the innermost-
# function rule: `refusal` constructs the refusal; `guard` is the predicate the
# guarding condition calls (absent for an inline comparison); `also` lists
# further deciding functions below it. `stage` names the coverage stage that
# will bring the site's functions into the refined closure while it is not
# covered. `cargo xtask spec-sync` rejects a site without an entry or an entry
# naming a function the scanner does not find.
schema = "auths-proof-check-site-functions/v1"

[[sites]]
site = "decode.action-bytes"
refusal = { file = "core/crates/auths-codec/src/decode.rs", function = "decode_canonical_action" }
stage = "codec: AP-SPEC-061"
note = "Whole canonical-action input over the action-bytes limit; codec_failure maps LimitExceeded to resource-limit-exceeded."


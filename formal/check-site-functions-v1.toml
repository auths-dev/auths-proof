also = [{ file = "core/crates/auths-codec/src/decode.rs", function = "decode_canonical_action" }]
stage = "codec: AP-SPEC-061"
note = "A canonical-action map header with the wrong number of pairs, as when the first pair is duplicated; map returns Malformed."


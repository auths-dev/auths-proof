# The coverage scope: which crates each scope takes and the declared role of
# every file in a scoped crate. A file added to a scoped crate must be given a
# role here in the same change; `cargo xtask formal coverage` rejects an
# unlisted or stale path. Roles other than "decision" are excluded from the
# decision and verifier-core scopes when listed in excluded_roles; a
# "test-support" file is not scanned at all.
#
# The roles follow study 006's table at 8bf2970c. Files added since carry
# "decision"; auths-registries/src/template.rs (the trusted-context template
# builder) is counted as decision logic, the reading that gives the smaller
# figure.
schema = "auths-proof-coverage-scope/v1"
verifier_crate = "core/crates/auths-verifier"
decision_kernel_crates = ["product/runtime/auths-lifecycle", "product/policy/auths-bounded-policy"]
translated_crates = [
    "core/crates/auths-model",
    "core/crates/auths-algebra-kernel",
    "core/crates/auths-authority",
    "product/runtime/auths-lifecycle",
    "product/policy/auths-bounded-policy",
    "product/runtime/auths-gateway-kernel",
    "product/runtime/auths-connections",
]
excluded_roles = ["crypto", "decoding", "explanation", "interface", "storage"]
nontrivial_code_lines = 4
every_file_listed = true

# Components named in the published claim when any of their crates' functions
# lies outside the refined closure; a component with no crate is outside the
# scanned scope altogether.
[[components]]
name = "the staged verifier control flow"
crates = ["core/crates/auths-verifier"]

[[components]]
name = "the composition evaluator"
crates = ["core/crates/auths-composition"]

[[components]]
name = "the registry handlers"
crates = ["core/crates/auths-registries"]

[[components]]
name = "the codec"
crates = ["core/crates/auths-codec"]

[[components]]
name = "the signature suites"
crates = []

[files]
"core/crates/auths-algebra-kernel/src/generated.rs" = "decision"

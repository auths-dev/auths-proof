# The kind of every audited theorem whose statement names a translated
# function: "exact" (for every input meeting the premises the function returns
# exactly its specification's value), "verdict-exact" (the statement fixes the
# component of the result that decides authorization), "partial" (a property
# that does not fix the verdict, or a subclass of inputs), or "case" (specific
# inputs). `cargo xtask formal coverage` rejects an audited theorem that names a
# translated function without a kind, and a kind for any other theorem.
#
# The theorems study 006 classified keep the kind both of its raters gave at
# 8bf2970c. Theorems added since were classified by the agent that added them
# and await a second rater.
schema = "auths-proof-theorem-kinds/v1"


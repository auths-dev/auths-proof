[graph]
all-features = true

[advisories]
yanked = "deny"
# iroh 1.0.3's Linux network watcher still reaches `paste` through
# netlink-packet-core 0.8.1. There is no fixed upstream release; this is an
# unmaintained notice, not a vulnerability. Keep it explicit and remove it
# when iroh's dependency graph replaces `paste`.
ignore = [
    "RUSTSEC-2024-0436",
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained notice for chrono via Iroh's Windows route discovery. Remove when netwatch drops WMI or turns off its chrono feature (n0-computer/net-tools#226)." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "NCSA",
    "MIT",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
# Restrict the chrono maintenance exception to the existing Windows
# route discovery chain. A new consumer of any link fails the audit.
deny = [
    { crate = "chrono", wrappers = ["wmi"] },
    { crate = "wmi", wrappers = ["netwatch"] },
    { crate = "netwatch", wrappers = ["iroh"] },
]
multiple-versions = "warn"
wildcards = "deny"
# Public crates may use path-only dev-dependencies on private workspace
# testkits/adapters. Cargo permits this for dev-dependencies, and their paths
# are repository-local; published dependency surfaces remain version-pinned.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

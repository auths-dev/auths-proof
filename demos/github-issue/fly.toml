app = "auths-issue-workflow"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
AUTHS_GITHUB_ALLOWED_ORIGIN = "https://auths-github-demo.vercel.app"
AUTHS_GITHUB_API_BASE = "https://api.github.com"
AUTHS_GITHUB_WEB_BASE = "https://github.com"
AUTHS_GITHUB_BASE_REF = "main"
AUTHS_GITHUB_DATA_DIR = "/data/github"
AUTHS_GITHUB_EXECUTOR_AUDIENCE = "auths-github://public-demo-executor"
AUTHS_GITHUB_EXECUTOR_IDENTITY = "auths-github-public-demo"
AUTHS_GITHUB_GIT = "/usr/bin/git"
AUTHS_GITHUB_RECEIPT_VIEW_BASE_URL = "https://auths-github-demo.vercel.app/receipts"
AUTHS_GITHUB_RELEASE = "github-issue-v1"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 2
hard_limit = 4

[[http_service.checks]]
grace_period = "45s"
interval = "20s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[mounts]]
source = "auths_github_demo_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"

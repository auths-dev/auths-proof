[profile]
name = "todoist-created-task-populate"
version = 1
service = "todoist-delegation-demo"
tool = "populate_created_task"
command = "PopulateCreatedTask"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["todoist-populate-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.task_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.task_commitment]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.todoist_task_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.text]
type = "string"
min_bytes = 1
max_bytes = 192

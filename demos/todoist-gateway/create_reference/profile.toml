[profile]
name = "todoist-project-task-create"
version = 1
service = "todoist-delegation-demo"
tool = "create_project_task"
command = "CreateProjectTask"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["todoist-created-child-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.task_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.task_commitment]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.project_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.content]
type = "string"
min_bytes = 1
max_bytes = 96

[arguments.fields.recovery_marker]
type = "string"
min_bytes = 16
max_bytes = 64

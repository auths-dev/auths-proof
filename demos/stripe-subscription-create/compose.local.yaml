services:
  subscription-create:
    build:
      context: ../..
      dockerfile: demos/stripe-subscription-create/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_SUBSCRIPTION_CREATE_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-subscription-create"
    ports:
      - "8080:8080"
    volumes:
      - subscription-create-state:/data/auths-stripe-subscription-create
    restart: unless-stopped

volumes:
  subscription-create-state:

[profile]
name = "airtable-gateway-record-update"
version = 1
service = "airtable-gateway-demo"
tool = "set_demo_status"
command = "SetDemoStatus"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["airtable-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 128

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.record_id]
type = "string"
min_bytes = 17
max_bytes = 43

[arguments.fields.replacement]
type = "enum"
variants = ["Approved", "Pending"]

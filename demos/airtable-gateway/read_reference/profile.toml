[profile]
name = "airtable-record-read-release"
version = 2
service = "airtable-delegation-demo"
tool = "release_demo_status"
command = "ReleaseDemoStatus"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["airtable-read-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.task_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.task_commitment]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.agent_principal]
type = "string"
min_bytes = 1
max_bytes = 128

[arguments.fields.resource_id]
type = "string"
min_bytes = 17
max_bytes = 43

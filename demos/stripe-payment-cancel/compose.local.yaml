services:
  cancel:
    build:
      context: ../..
      dockerfile: demos/stripe-payment-cancel/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_PAYMENT_CANCEL_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-payment-cancel"
    ports:
      - "8080:8080"
    volumes:
      - cancel-state:/data/auths-stripe-payment-cancel
    restart: unless-stopped

volumes:
  cancel-state:

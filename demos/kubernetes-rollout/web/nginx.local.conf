server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ "^/receipts/[0-9a-f]{32}/?$" {
        try_files /receipt.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
    }

    location = /build {
        proxy_pass http://backend:8080/build;
    }

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

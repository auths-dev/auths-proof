app = "auths-kubernetes-demo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AUTHS_KUBERNETES_ALLOWED_ORIGIN = "https://auths-kubernetes-demo.vercel.app"
  AUTHS_KUBERNETES_RELEASE = "production"
  AUTHS_KUBERNETES_STATE_DIR = "/data/auths-kubernetes"
  AUTHS_KUBERNETES_NAMESPACE = "auths-demo"
  AUTHS_KUBERNETES_DEPLOYMENT = "color-service"
  AUTHS_KUBERNETES_CONTAINER = "color-service"
  AUTHS_KUBERNETES_EXECUTOR_AUDIENCE = "https://auths-kubernetes-demo.fly.dev"

[[mounts]]
  source = "auths_kubernetes_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

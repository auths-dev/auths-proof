apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-service
  namespace: auths-demo
  labels:
    app.kubernetes.io/name: auths-color-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auths-color-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auths-color-service
    spec:
      containers:
        - name: color-service
          image: ghcr.io/auths-dev/auths-kubernetes-color-service@sha256:REPLACE_WITH_IMAGE_A
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: color-service
  namespace: auths-demo
spec:
  selector:
    app.kubernetes.io/name: auths-color-service
  ports:
    - name: http
      port: 80
      targetPort: 8080

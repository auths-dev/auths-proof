services:
  stripe-subscription-cancel:
    build:
      context: ../..
      dockerfile: demos/stripe-subscription-cancel/Dockerfile
    environment:
      AUTHS_STRIPE_ALLOWED_ORIGIN: http://localhost:8080
      AUTHS_STRIPE_STATE_DIR: /data/auths-stripe-subscription-cancel
    ports: ["8080:8080"]
    volumes: ["subscription-cancel-data:/data/auths-stripe-subscription-cancel"]
volumes:
  subscription-cancel-data:

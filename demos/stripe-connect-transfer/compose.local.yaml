services:
  stripe-connect-transfer:
    build:
      context: ../..
      dockerfile: demos/stripe-connect-transfer/Dockerfile
    environment:
      AUTHS_STRIPE_ALLOWED_ORIGIN: http://localhost:8080
      AUTHS_STRIPE_STATE_DIR: /data/auths-stripe-connect-transfer
    ports:
      - "8080:8080"
    volumes:
      - connect-transfer-data:/data/auths-stripe-connect-transfer

volumes:
  connect-transfer-data:

services:
  purchase-authorization:
    build:
      context: ../..
      dockerfile: demos/stripe-purchase-authorization/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-purchase-authorization"
    ports:
      - "8080:8080"
    volumes:
      - purchase-authorization-state:/data/auths-stripe-purchase-authorization
    restart: unless-stopped

volumes:
  purchase-authorization-state:

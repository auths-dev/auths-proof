app = "auths-live-demo"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 10

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 100
hard_limit = 200

[[http_service.checks]]
grace_period = "20s"
interval = "15s"
method = "GET"
path = "/healthz"
timeout = "3s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

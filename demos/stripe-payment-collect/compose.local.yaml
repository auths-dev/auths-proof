services:
  collect:
    build:
      context: ../..
      dockerfile: demos/stripe-payment-collect/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_PAYMENT_COLLECT_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-payment-collect"
    ports:
      - "8080:8080"
    volumes:
      - collect-state:/data/auths-stripe-payment-collect
    restart: unless-stopped

volumes:
  collect-state:

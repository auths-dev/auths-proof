services:
  authorize:
    build:
      context: ../..
      dockerfile: demos/stripe-payment-authorize/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_PAYMENT_AUTHORIZE_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-payment-authorize"
    ports:
      - "8080:8080"
    volumes:
      - authorize-state:/data/auths-stripe-payment-authorize
    restart: unless-stopped

volumes:
  authorize-state:

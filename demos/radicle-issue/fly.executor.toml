app = "auths-radicle-demo"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
AUTHS_RADICLE_ROLE = "executor"
AUTHS_RADICLE_RAD_BIN = "/usr/local/bin/rad"
AUTHS_RADICLE_GIT_BIN = "/usr/bin/git"
AUTHS_RADICLE_HELPER_PATH = "/usr/local/bin:/usr/bin:/bin"
AUTHS_RADICLE_HOME = "/data/radicle"
AUTHS_RADICLE_LISTEN = "[::]:8776"
AUTHS_RADICLE_EXPECTED_VERSION = "rad 1.9.1 (5bd3569e120a6172d9df68e1d1d0eed15e8104b1)"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 4
hard_limit = 8

[[http_service.checks]]
grace_period = "90s"
interval = "20s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[services]]
protocol = "tcp"
internal_port = 8776
processes = ["app"]

[[services.ports]]
port = 8776

[[mounts]]
source = "auths_radicle_executor_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"

services:
  stripe-payout:
    build:
      context: ../..
      dockerfile: demos/stripe-payout/Dockerfile
    environment:
      AUTHS_STRIPE_ALLOWED_ORIGIN: http://localhost:8080
      AUTHS_STRIPE_STATE_DIR: /data/auths-stripe-payout
    ports: ["8080:8080"]
    volumes: ["payout-data:/data/auths-stripe-payout"]
volumes:
  payout-data:

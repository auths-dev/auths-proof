app = "auths-records-demo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AUTHS_RECORDS_ALLOWED_ORIGIN = "https://auths-records-demo.fly.dev"
  AUTHS_RECORDS_EXECUTOR_AUDIENCE = "https://records-executor.auths.dev"
  AUTHS_RECORDS_PUBLIC_URL = "https://auths-records-demo.fly.dev"
  AUTHS_RECORDS_STATE_PATH = "/data/auths-records/ledger-v2.json"

[[mounts]]
  source = "auths_records_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

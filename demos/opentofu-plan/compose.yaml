services:
  api:
    image: auths-opentofu-demo:${AUTHS_DEMO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: demos/opentofu-plan/Dockerfile
      args:
        OPENTOFU_SANDBOX: local
    environment:
      AUTHS_OPENTOFU_BIND: 0.0.0.0:8080
      AUTHS_OPENTOFU_ALLOWED_ORIGIN: http://localhost:4174
      AUTHS_OPENTOFU_MODE: live
      AUTHS_OPENTOFU_BINARY: /usr/local/bin/tofu
      AUTHS_OPENTOFU_WORKING_DIRECTORY: /workspace/opentofu
      AUTHS_OPENTOFU_STATE_DIR: /data/auths-opentofu/service
      AUTHS_OPENTOFU_WORKSPACE: auths-demo
      AUTHS_OPENTOFU_BACKEND_IDENTITY: local-volume://auths-opentofu-demo
      AUTHS_OPENTOFU_EXECUTOR_AUDIENCE: http://localhost:4174
      AUTHS_OPENTOFU_VERSION: 1.12.5
      AUTHS_OPENTOFU_PROVIDER_SOURCES: registry.opentofu.org/hashicorp/local
      AUTHS_OPENTOFU_RESOURCE_TYPES: local_file
      AUTHS_OPENTOFU_MAX_CHANGES: "1"
      AUTHS_OPENTOFU_MAX_PLAN_AGE_SECONDS: "120"
      AUTHS_OPENTOFU_MAX_AUTHORIZATION_SECONDS: "120"
      AUTHS_OPENTOFU_TIMEOUT_SECONDS: "90"
      AUTHS_OPENTOFU_PLANNER_BUILD: auths-opentofu-demo/1
      AUTHS_OPENTOFU_TOOL_BUILD: opentofu/1.12.5-linux-amd64
      AUTHS_OPENTOFU_MODULE_MANIFEST: root:local-file@v1;provider:hashicorp/local@2.9.0
      AUTHS_OPENTOFU_SESSION_VARIABLE: TF_VAR_AUTHS_OBJECT_ID
      AUTHS_OPENTOFU_SESSION_WORKSPACE: "true"
      AUTHS_OPENTOFU_FAULT: "${AUTHS_OPENTOFU_FAULT:-none}"
      AUTHS_OPENTOFU_CREDENTIAL_JSON: '{"TF_VAR_AUTHS_OBJECT_ID":"session-00000000000000000000000000000000","TF_VAR_AUTHS_OBJECT_VALUE":"authorized-by-exact-saved-plan"}'
    volumes:
      - opentofu-data:/data

  web:
    image: nginx:1.29.5-alpine
    depends_on:
      - api
    ports:
      - "${AUTHS_OPENTOFU_WEB_PORT:-4174}:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  opentofu-data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auths-node
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: auths-node}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auths-node}
    spec:
      serviceAccountName: auths-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: auths-node}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: auths-node}
      containers:
        - name: auths-node
          image: ghcr.io/auths-dev/auths-node@sha256:REPLACE_WITH_RELEASE_DIGEST
          args: ["/etc/auths/auths.toml"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: AUTHS_POSTGRES_URL
              valueFrom: {secretKeyRef: {name: auths-runtime, key: postgres-url}}
          volumeMounts:
            - {name: config, mountPath: /etc/auths, readOnly: true}
            - {name: postgres-ca, mountPath: /run/secrets/postgres, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: auths-node-config}
        - name: postgres-ca
          secret: {secretName: auths-postgres-ca}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}

apiVersion: v1
kind: ConfigMap
metadata:
  name: auths-node-config
data:
  auths.toml: |
    contract_version = 1
    mode = "production"
    bind = "0.0.0.0:8080"
    release = "open-production-candidate-1"
    semantic_id = "auths.open-production/1"
    request_timeout_ms = 10000
    drain_timeout_seconds = 30
    ingress_tls = true
    [lifecycle]
    url_env = "AUTHS_POSTGRES_URL"
    ca_pem = "/run/secrets/postgres/ca.pem"
    server_name = "auths-postgres.auths-system.svc"
    maximum_records = 1000000
    [custody]
    kind = "pkcs11"
    module = "/usr/lib/softhsm/libsofthsm2.so"
    token = "auths-production"
    object_hex = "01"
    pin_env = "AUTHS_PKCS11_PIN"
    [telemetry]
    otlp_endpoint = "http://otel-collector.observability.svc:4317"
    service_name = "auths-node"
    [profiles]
    opentofu_saved_plan_apply = true
    postgresql_bounded_update = true
    github_issue_address = true
    sandbox_providers = false

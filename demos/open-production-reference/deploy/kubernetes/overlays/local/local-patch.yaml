apiVersion: apps/v1
kind: Deployment
metadata:
  name: auths-node
spec:
  template:
    spec:
      nodeSelector:
        auths.dev/pkcs11: "true"
      containers:
        - name: auths-node
          env:
            - name: AUTHS_PKCS11_PIN
              valueFrom: {secretKeyRef: {name: auths-runtime, key: pkcs11-pin}}

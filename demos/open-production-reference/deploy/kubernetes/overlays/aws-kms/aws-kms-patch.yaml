apiVersion: apps/v1
kind: Deployment
metadata:
  name: auths-node
spec:
  template:
    spec:
      containers:
        - name: auths-node
          env:
            - name: AUTHS_KMS_KEY_ARN
              valueFrom: {secretKeyRef: {name: auths-runtime, key: kms-key-arn}}
            - name: AWS_REGION
              value: eu-west-2

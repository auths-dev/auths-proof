name: auths-open-production

x-auths-node: &auths-node
  build:
    context: ../../..
    dockerfile: demos/open-production-reference/Dockerfile
  command: ["/etc/auths/local.toml"]
  environment:
    AUTHS_LOCAL_SEED: ${AUTHS_LOCAL_SEED:?provide a 32-byte unpadded base64url seed}
    AUTHS_POSTGRES_URL: postgresql://auths@postgres:5432/auths?sslmode=require
  volumes:
    - ../config/local.toml:/etc/auths/local.toml:ro
    - ./postgres/certs/ca.crt:/run/secrets/postgres-ca.pem:ro
    # Generated by tests/generate-local-context.sh before the stack starts.
    # `[verification] trusted_context_path` is mandatory -- a node that cannot
    # state its trust anchors cannot decide anything -- so without this mount
    # every replica exits 1 on startup.
    - ./context/trusted-context.cbor:/run/config/trusted-context.cbor:ro
  depends_on:
    postgres:
      condition: service_healthy
    softhsm:
      condition: service_healthy
    otel-collector:
      condition: service_started
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  auths-1:
    <<: *auths-node
    ports: ["127.0.0.1:18081:8080"]
  auths-2:
    <<: *auths-node
    ports: ["127.0.0.1:18082:8080"]
  auths-3:
    <<: *auths-node
    ports: ["127.0.0.1:18083:8080"]

  ingress:
    image: nginx:1.29.4-alpine@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
    ports: ["8443:8443"]
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ingress/certs:/etc/nginx/certs:ro
    depends_on: [auths-1, auths-2, auths-3]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17.4-bookworm@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    environment:
      POSTGRES_DB: auths
      POSTGRES_USER: auths
      POSTGRES_HOST_AUTH_METHOD: trust
    entrypoint: ["/usr/local/bin/auths-postgres-entrypoint"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/auths-certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/auths-certs/server.key
    volumes:
      - lifecycle-data:/var/lib/postgresql/data
      - ./postgres/certs:/certs:ro
      - ./postgres/entrypoint.sh:/usr/local/bin/auths-postgres-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auths -d auths"]
      interval: 2s
      timeout: 2s
      retries: 30

  softhsm:
    build: ./softhsm
    environment:
      AUTHS_SOFTHSM_PIN: ${AUTHS_SOFTHSM_PIN:-123456}
    volumes:
      - softhsm-data:/var/lib/softhsm
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0@sha256:a7343f01869071ea3f4c5e1e97df1bb1b3c4d5c77247db80e053a80b9df530c4
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./otel:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:12.3.2-security-01-ubuntu@sha256:b24a77bc372164ededadfc990e5aa4a0abf6269ad9fd83973dcc02db3e0c7520
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - ./otel/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/auths.yaml:ro
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/auths.yaml:ro

volumes:
  lifecycle-data:
  softhsm-data:

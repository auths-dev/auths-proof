[profile]
name = "google-project-a-read-release"
version = 1
service = "google-drive-delegation-demo"
tool = "release_project_a_text"
command = "ReleaseProjectAText"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["google-read-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.task_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.agent_principal]
type = "string"
min_bytes = 1
max_bytes = 128

[arguments.fields.resource_id]
type = "string"
min_bytes = 1
max_bytes = 64

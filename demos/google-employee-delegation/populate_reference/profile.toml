max_bytes = 32

[arguments.fields.task_commitment]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.document_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.tab_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.text]
type = "string"
min_bytes = 1
max_bytes = 192

[arguments.fields.required_revision_id]
type = "string"
min_bytes = 1

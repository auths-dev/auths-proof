[project]
name = "auths-google-employee-read-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["auths==0.0.1rc1", "cryptography>=44,<47", "openai>=2,<3"]

[project.scripts]
auths-google-read-agent = "employee_read_agent.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

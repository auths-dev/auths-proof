[profile]
name = "google-drive-project-a-create"
version = 1
service = "google-drive-delegation-demo"
tool = "create_project_a_document"
command = "CreateProjectADocument"

[arguments]
type = "object"

[arguments.fields.operator_namespace]
type = "enum"
variants = ["google-drive-create-demo"]

[arguments.fields.operation_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.recipe_digest]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.task_id]
type = "string"
min_bytes = 1
max_bytes = 32

[arguments.fields.task_commitment]
type = "string"
min_bytes = 64
max_bytes = 64

[arguments.fields.parent_id]
type = "string"
min_bytes = 1
max_bytes = 64

[arguments.fields.title]
type = "string"
min_bytes = 1
max_bytes = 96

[arguments.fields.recovery_marker]
type = "string"
min_bytes = 16
max_bytes = 64

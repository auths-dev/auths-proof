name: auths-ap071-isolation

# Run the installed AP-071 gateway and the registered agent in separate mount,
# process and network namespaces. Both containers intentionally use the same
# numeric UID so the existing owner-only Unix release socket can be shared;
# that UID has no access to the other container's private mounts. No Docker
# socket, host PID namespace or host network is shared.
services:
  gateway:
    image: ${AP071_GATEWAY_IMAGE:?set a digest-pinned installed gateway image}
    entrypoint: ["/bin/sleep", "infinity"]
    user: "${AP071_RUNTIME_UID:?set host UID}:${AP071_RUNTIME_GID:?set host GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - ${AP071_GATEWAY_STATE_DIR:?set private gateway state directory}:/gateway-state:rw
      - ${AP071_OPERATOR_PRIVATE_DIR:?set private operator input directory}:/operator:ro
      - ap071_channel:/channel:ro
    networks: [provider_egress]

  agent:
    image: ${AP071_AGENT_IMAGE:?set a digest-pinned installed agent image}
    entrypoint: ["/bin/sleep", "infinity"]
    user: "${AP071_RUNTIME_UID:?set host UID}:${AP071_RUNTIME_GID:?set host GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    volumes:
      - ${AP071_AGENT_DIR:?set private agent key and action directory}:/agent:rw
      - ap071_channel:/channel:rw
    network_mode: none

networks:
  provider_egress: {}

volumes:
  ap071_channel:
    external: true
    name: ${AP071_CHANNEL_VOLUME:?set an initialized private Docker channel volume}

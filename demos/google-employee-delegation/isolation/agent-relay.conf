worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off;
  server {
    listen 8080;
    client_max_body_size 800k;
    set $broker_upstream broker:8765;
    location = /api/v1/tasks/challenge {
      limit_except POST { deny all; }
      proxy_pass http://$broker_upstream;
      proxy_set_header Host 127.0.0.1:8765;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-CSRF-Token "";
      proxy_set_header Origin "";
    }
    location = /api/v1/tools/call {
      limit_except POST { deny all; }
      proxy_pass http://$broker_upstream;
      proxy_set_header Host 127.0.0.1:8765;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-CSRF-Token "";
      proxy_set_header Origin "";
    }
    location / { return 404; }
  }
}

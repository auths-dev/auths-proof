services:
  mandate:
    build:
      context: ../..
      dockerfile: demos/stripe-payment-mandate/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_PAYMENT_MANDATE_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-payment-mandate"
    ports:
      - "8080:8080"
    volumes:
      - mandate-state:/data/auths-stripe-payment-mandate
    restart: unless-stopped

volumes:
  mandate-state:

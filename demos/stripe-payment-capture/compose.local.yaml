services:
  capture:
    build:
      context: ../..
      dockerfile: demos/stripe-payment-capture/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      AUTHS_STRIPE_ALLOWED_ORIGIN: "http://localhost:8080"
      AUTHS_PAYMENT_CAPTURE_PUBLIC_API_BASE: "http://localhost:8080"
      AUTHS_STRIPE_STATE_DIR: "/data/auths-stripe-payment-capture"
    ports:
      - "8080:8080"
    volumes:
      - capture-state:/data/auths-stripe-payment-capture
    restart: unless-stopped

volumes:
  capture-state:
